<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Plate with Rounded Corners -->
  <rect width="512" height="512" rx="64" fill="#0b0f19"/>
  <circle cx="256" cy="240" r="210" fill="url(#bgGlow)"/>

  <!-- Outer Golden Border -->
  <rect x="16" y="16" width="480" height="480" rx="52" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.75"/>

  <!-- Sparkling Center Icon / Visual -->
  <g transform="translate(256, 220) scale(1)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="120" fill="url(#goldGrad)" opacity="0.25"/>
    <text x="0" y="45" font-size="120" text-anchor="middle">💍</text>
  </g>

  <!-- Top Badge Ribbon -->
  <g transform="translate(256, 50)">
    <rect x="-70" y="-16" width="140" height="32" rx="16" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#softGlow)"/>
    <text x="0" y="6" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">PROPOSAL</text>
  </g>

  <!-- Title Plate -->
  <g transform="translate(256, 420)">
    <rect x="-170" y="-30" width="340" height="56" rx="28" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#softGlow)"/>
    <text x="0" y="6" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="18" text-anchor="middle">Diamond Solitaire Ring</text>
  </g>

  <!-- Coin Price Pill -->
  <g transform="translate(256, 465)">
    <text x="0" y="0" fill="#E0F2FE" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" text-anchor="middle">💎 7000 Gems</text>
  </g>
</svg>