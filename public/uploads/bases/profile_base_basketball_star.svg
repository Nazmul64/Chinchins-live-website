<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="basketOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="30%" stop-color="#FB923C"/>
      <stop offset="70%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="basketGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <filter id="basketGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Frame Ring -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="url(#basketGold)" stroke-width="14" filter="url(#basketGlow)"/>
  <circle cx="250" cy="250" r="162" fill="none" stroke="url(#basketOrange)" stroke-width="3"/>
  <circle cx="250" cy="250" r="182" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>

  <!-- Top "BASKETBALL" Golden Banner -->
  <g transform="translate(250, 60)" filter="url(#basketGlow)">
    <path d="M -130 25 Q 0 -15 130 25 L 115 62 Q 0 25 -115 62 Z" fill="url(#basketGold)" stroke="#78350F" stroke-width="2.5"/>
    <text x="0" y="42" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="#78350F" text-anchor="middle" letter-spacing="3">BASKETBALL</text>
  </g>

  <!-- Bottom Left: Orange Textured Basketball -->
  <g transform="translate(110, 390)" filter="url(#basketGlow)">
    <circle cx="0" cy="0" r="42" fill="url(#basketOrange)" stroke="#431407" stroke-width="3"/>
    <!-- Basketball Seam Lines -->
    <path d="M -42 0 L 42 0" stroke="#431407" stroke-width="3.5"/>
    <path d="M 0 -42 L 0 42" stroke="#431407" stroke-width="3.5"/>
    <path d="M -30 -30 Q 0 0 -30 30" stroke="#431407" stroke-width="3" fill="none"/>
    <path d="M 30 -30 Q 0 0 30 30" stroke="#431407" stroke-width="3" fill="none"/>
  </g>

  <!-- Bottom Right: Basketball Hoop Rim & Net -->
  <g transform="translate(385, 385)" filter="url(#basketGlow)">
    <!-- Backboard Mini -->
    <rect x="-35" y="-55" width="70" height="45" rx="5" fill="#FFFFFF" stroke="#DC2626" stroke-width="3"/>
    <rect x="-18" y="-45" width="36" height="25" fill="none" stroke="#DC2626" stroke-width="2.5"/>
    <!-- Orange Rim -->
    <ellipse cx="0" cy="-10" rx="30" ry="8" fill="none" stroke="#EA580C" stroke-width="4"/>
    <!-- White Net -->
    <path d="M -25 -8 L -15 25 L 0 32 L 15 25 L 25 -8" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4 2"/>
    <path d="M -15 -8 L 0 25 L 15 -8" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  </g>
</svg>
