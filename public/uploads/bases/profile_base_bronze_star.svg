<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <filter id="bronzeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="175" fill="none" stroke="url(#bronzeGrad)" stroke-width="12" filter="url(#bronzeGlow)"/>
  <circle cx="250" cy="250" r="165" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>

  <!-- Top Star -->
  <g transform="translate(250, 75)" filter="url(#bronzeGlow)">
    <polygon points="0,-18 5,-5 18,-5 8,4 12,16 0,8 -12,16 -8,4 -18,-5 -5,-5" fill="url(#bronzeGrad)" stroke="#FFF" stroke-width="1"/>
  </g>
</svg>
