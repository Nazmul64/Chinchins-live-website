<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bronzeCrownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <linearGradient id="emeraldGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="bronzeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes crownGleam { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    .royal-crown-1 { transform-origin: 250px 75px; animation: crownGleam 2.8s infinite ease-in-out; }
  </style>

  <!-- Left Golden Laurel Wings -->
  <g transform="translate(100, 250)" filter="url(#bronzeGlow)">
    <path d="M 0 -15 C -30 -30 -45 -10 -35 15 C -25 5 -10 0 0 -15 Z" fill="url(#bronzeCrownGold)" stroke="#854D0E" stroke-width="1.5"/>
    <path d="M 0 10 C -35 -5 -50 15 -40 35 C -30 25 -15 20 0 10 Z" fill="url(#bronzeCrownGold)" stroke="#854D0E" stroke-width="1.5"/>
    <path d="M 0 30 C -25 25 -35 45 -30 60 C -20 50 -10 40 0 30 Z" fill="url(#emeraldGem)"/>
  </g>

  <!-- Right Golden Laurel Wings -->
  <g transform="translate(400, 250)" filter="url(#bronzeGlow)">
    <path d="M 0 -15 C 30 -30 45 -10 35 15 C 25 5 10 0 0 -15 Z" fill="url(#bronzeCrownGold)" stroke="#854D0E" stroke-width="1.5"/>
    <path d="M 0 10 C 35 -5 50 15 40 35 C 30 25 15 20 0 10 Z" fill="url(#bronzeCrownGold)" stroke="#854D0E" stroke-width="1.5"/>
    <path d="M 0 30 C 25 25 35 45 30 60 C 20 50 10 40 0 30 Z" fill="url(#emeraldGem)"/>
  </g>

  <!-- Circular Avatar Golden Rim (Hollow for Avatar) -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="url(#bronzeCrownGold)" stroke-width="14" filter="url(#bronzeGlow)"/>
  <circle cx="250" cy="250" r="162" fill="none" stroke="url(#emeraldGem)" stroke-width="3"/>
  <circle cx="250" cy="250" r="182" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

  <!-- Top Imperial Royal Gold Crown with Emerald Gemstones -->
  <g class="royal-crown-1" filter="url(#bronzeGlow)">
    <path d="M 185 105 L 170 45 L 210 70 L 250 18 L 290 70 L 330 45 L 315 105 Z" fill="url(#bronzeCrownGold)" stroke="#FFFFFF" stroke-width="2"/>
    <ellipse cx="250" cy="105" rx="68" ry="16" fill="url(#emeraldGem)" stroke="url(#bronzeCrownGold)" stroke-width="3"/>
    <!-- Crown Jewels -->
    <circle cx="250" cy="18" r="8" fill="#FFFFFF" stroke="url(#emeraldGem)" stroke-width="2"/>
    <circle cx="170" cy="45" r="6" fill="url(#emeraldGem)" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="330" cy="45" r="6" fill="url(#emeraldGem)" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="210" cy="70" r="5" fill="#FFF"/>
    <circle cx="290" cy="70" r="5" fill="#FFF"/>
    <circle cx="250" cy="105" r="7" fill="#FFFFFF"/>
  </g>

  <!-- Bottom Golden Star Plaque -->
  <g transform="translate(250, 420)" filter="url(#bronzeGlow)">
    <polygon points="0,-18 5,-5 18,-5 8,4 12,17 0,9 -12,17 -8,4 -18,-5 -5,-5" fill="url(#bronzeCrownGold)" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Sparkles -->
  <polygon points="130,80 134,92 146,96 134,100 130,112 126,100 114,96 126,92" fill="#FFF" opacity="0.9"/>
  <polygon points="370,80 374,92 386,96 374,100 370,112 366,100 354,96 366,92" fill="#FFF" opacity="0.9"/>
</svg>
