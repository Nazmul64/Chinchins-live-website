<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="circusGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <linearGradient id="circusRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="circusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Golden Ring Frame -->
  <circle cx="250" cy="250" r="175" fill="none" stroke="url(#circusGold)" stroke-width="14" filter="url(#circusGlow)"/>
  <circle cx="250" cy="250" r="165" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  <circle cx="250" cy="250" r="185" fill="none" stroke="url(#circusRed)" stroke-width="3"/>

  <!-- Top Right: Magic Top Hat with Golden Stars -->
  <g transform="translate(360, 95)" filter="url(#circusGlow)">
    <!-- Hat Brim -->
    <ellipse cx="0" cy="20" rx="45" ry="12" fill="url(#circusGold)" stroke="#78350F" stroke-width="2"/>
    <!-- Hat Body -->
    <path d="M -28 20 L -34 -30 L 34 -30 L 28 20 Z" fill="url(#circusRed)" stroke="url(#circusGold)" stroke-width="3"/>
    <!-- Hat Ribbon -->
    <rect x="-30" y="5" width="60" height="12" fill="url(#circusGold)"/>
    <!-- Golden Star -->
    <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#FFF"/>
  </g>

  <!-- Bottom Left: "Rich" Banner -->
  <g transform="translate(130, 410)" filter="url(#circusGlow)">
    <path d="M -45 -12 L 45 -12 L 35 15 L -55 15 Z" fill="url(#circusRed)" stroke="url(#circusGold)" stroke-width="2.5"/>
    <text x="-5" y="6" font-family="'Arial Black', Impact, sans-serif" font-size="18" font-weight="900" fill="url(#circusGold)" text-anchor="middle">Rich</text>
  </g>
</svg>
