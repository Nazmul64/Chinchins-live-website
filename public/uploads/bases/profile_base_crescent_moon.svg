<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="moonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="moonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="moonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing Crescent Ring -->
  <circle cx="250" cy="250" r="175" fill="none" stroke="url(#moonPurple)" stroke-width="15" filter="url(#moonGlow)"/>
  <circle cx="250" cy="250" r="165" fill="none" stroke="url(#moonGold)" stroke-width="3"/>
  <circle cx="250" cy="250" r="185" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>

  <!-- Top Crescent Moon & Sparkling Star -->
  <g transform="translate(250, 65)" filter="url(#moonGlow)">
    <!-- Crescent Moon -->
    <path d="M -15 -25 A 25 25 0 0 0 15 25 A 20 20 0 0 1 -15 -25 Z" fill="url(#moonGold)" stroke="#FFF" stroke-width="1.5"/>
    <!-- Star -->
    <polygon points="12,-5 14,-1 18,-1 15,2 16,6 12,3 8,6 9,2 6,-1 10,-1" fill="#FFF"/>
  </g>

  <!-- Bottom Crystal Star Wings -->
  <g transform="translate(250, 420)" filter="url(#moonGlow)">
    <path d="M -60 -5 Q 0 25 60 -5 Q 0 10 -60 -5 Z" fill="url(#moonPurple)" stroke="url(#moonGold)" stroke-width="2"/>
    <circle cx="0" cy="10" r="8" fill="url(#moonGold)" stroke="#FFF" stroke-width="1.5"/>
  </g>
</svg>
