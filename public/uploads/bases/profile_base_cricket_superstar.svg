<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cricketGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <linearGradient id="cricketBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="cricketGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Ring -->
  <circle cx="250" cy="250" r="175" fill="none" stroke="url(#cricketGold)" stroke-width="14" filter="url(#cricketGlow)"/>
  <circle cx="250" cy="250" r="165" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  <circle cx="250" cy="250" r="185" fill="none" stroke="#0284C7" stroke-width="3"/>

  <!-- Top "Cricket" Arch Banner -->
  <g transform="translate(250, 60)" filter="url(#cricketGlow)">
    <path d="M -110 30 Q 0 -10 110 30 L 95 65 Q 0 25 -95 65 Z" fill="url(#cricketGold)" stroke="#78350F" stroke-width="2"/>
    <text x="0" y="42" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" fill="#78350F" text-anchor="middle" letter-spacing="2">CRICKET</text>
  </g>

  <!-- Bottom Left: Cricket Helmet & Bat -->
  <g transform="translate(100, 390)" filter="url(#cricketGlow)">
    <!-- Bat -->
    <rect x="-10" y="-80" width="16" height="90" rx="3" fill="#D97706" transform="rotate(-35)" stroke="#78350F" stroke-width="2"/>
    <!-- Blue Helmet -->
    <ellipse cx="20" cy="-20" rx="35" ry="30" fill="url(#cricketBlue)" stroke="url(#cricketGold)" stroke-width="3"/>
    <path d="M 0 -20 Q 30 -10 45 -20 L 50 -10 Q 30 5 -5 -10 Z" fill="#94A3B8" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="20" cy="-30" r="6" fill="#FDE047"/>
  </g>

  <!-- Bottom Right: Wickets & Red Cricket Ball -->
  <g transform="translate(390, 390)" filter="url(#cricketGlow)">
    <!-- Wicket Stumps -->
    <rect x="-20" y="-70" width="6" height="70" fill="url(#cricketGold)"/>
    <rect x="-8" y="-70" width="6" height="70" fill="url(#cricketGold)"/>
    <rect x="4" y="-70" width="6" height="70" fill="url(#cricketGold)"/>
    <rect x="-24" y="-75" width="38" height="5" rx="2" fill="url(#cricketGold)"/>
    <!-- Shiny Red Ball with White Seam -->
    <circle cx="5" cy="-20" r="22" fill="#DC2626" stroke="#7F1D1D" stroke-width="2"/>
    <path d="M -15 -20 Q 5 -10 25 -20" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="3 2" fill="none"/>
  </g>
</svg>
