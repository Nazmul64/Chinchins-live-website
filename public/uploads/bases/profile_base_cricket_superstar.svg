<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cricketGold7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="cricketBlue7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cricketBall7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <filter id="cricketGlow7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes crownGleam7 { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    .royal-crown-7 { transform-origin: 250px 75px; animation: crownGleam7 2.8s infinite ease-in-out; }
  </style>

  <!-- Left Golden Wings -->
  <g transform="translate(100, 250)" filter="url(#cricketGlow7)">
    <path d="M 0 -20 C -35 -40 -55 -20 -45 10 C -35 0 -15 0 0 -20 Z" fill="url(#cricketGold7)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 0 5 C -40 -15 -60 15 -50 38 C -40 28 -15 20 0 5 Z" fill="url(#cricketBlue7)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 0 30 C -30 25 -45 50 -40 68 C -30 55 -10 40 0 30 Z" fill="url(#cricketGold7)"/>
  </g>

  <!-- Right Golden Wings -->
  <g transform="translate(400, 250)" filter="url(#cricketGlow7)">
    <path d="M 0 -20 C 35 -40 55 -20 45 10 C 35 0 15 0 0 -20 Z" fill="url(#cricketGold7)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 0 5 C 40 -15 60 15 50 38 C 40 28 15 20 0 5 Z" fill="url(#cricketBlue7)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 0 30 C 30 25 45 50 40 68 C 30 55 10 40 0 30 Z" fill="url(#cricketGold7)"/>
  </g>

  <!-- Circular Avatar Golden Rim (Hollow for Avatar) -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="url(#cricketGold7)" stroke-width="15" filter="url(#cricketGlow7)"/>
  <circle cx="250" cy="250" r="162" fill="none" stroke="url(#cricketBlue7)" stroke-width="3"/>
  <circle cx="250" cy="250" r="182" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

  <!-- Top "CRICKET" Arch Banner & Royal Crown on top -->
  <g class="royal-crown-7" filter="url(#cricketGlow7)">
    <!-- Golden Crown -->
    <path d="M 200 45 L 185 10 L 220 28 L 250 -5 L 280 28 L 315 10 L 300 45 Z" fill="url(#cricketGold7)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="250" cy="-5" r="7" fill="#DC2626" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="185" cy="10" r="5" fill="url(#cricketBlue7)" stroke="#FFF" stroke-width="1"/>
    <circle cx="315" cy="10" r="5" fill="url(#cricketBlue7)" stroke="#FFF" stroke-width="1"/>
    <!-- Arched "CRICKET" Golden Plaque Banner -->
    <path d="M 140 70 Q 250 25 360 70 L 345 105 Q 250 65 155 105 Z" fill="url(#cricketGold7)" stroke="#78350F" stroke-width="3"/>
    <text x="250" y="82" font-family="'Arial Black', Impact, sans-serif" font-size="25" font-weight="900" fill="#78350F" stroke="#FFF" stroke-width="1" text-anchor="middle" letter-spacing="3">CRICKET</text>
  </g>

  <!-- Bottom Left: Cricket Blue Helmet & Golden Bat -->
  <g transform="translate(105, 385)" filter="url(#cricketGlow7)">
    <rect x="-8" y="-70" width="14" height="75" rx="3" fill="#D97706" transform="rotate(-35)" stroke="#78350F" stroke-width="2"/>
    <ellipse cx="15" cy="-15" rx="30" ry="25" fill="url(#cricketBlue7)" stroke="url(#cricketGold7)" stroke-width="3"/>
    <path d="M 0 -15 Q 25 -5 38 -15 L 42 -5 Q 25 8 -5 -5 Z" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.5"/>
  </g>

  <!-- Bottom Right: Wicket Stumps & Shiny Red Ball -->
  <g transform="translate(390, 385)" filter="url(#cricketGlow7)">
    <rect x="-18" y="-60" width="5" height="60" fill="url(#cricketGold7)"/>
    <rect x="-7" y="-60" width="5" height="60" fill="url(#cricketGold7)"/>
    <rect x="4" y="-60" width="5" height="60" fill="url(#cricketGold7)"/>
    <rect x="-22" y="-64" width="34" height="4" rx="2" fill="url(#cricketGold7)"/>
    <circle cx="5" cy="-15" r="20" fill="url(#cricketBall7)" stroke="#450A0A" stroke-width="2"/>
    <path d="M -12 -15 Q 5 -7 22 -15" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 2" fill="none"/>
  </g>
</svg>
