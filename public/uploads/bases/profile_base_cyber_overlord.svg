<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mechNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="laserPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="mechGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Mech Wings -->
  <g filter="url(#mechGlow)">
    <polygon points="120,220 30,150 70,80 130,180" fill="url(#mechNeon)"/>
    <polygon points="90,250 10,200 45,130 100,230" fill="url(#laserPink)"/>
  </g>

  <!-- Right Mech Wings -->
  <g filter="url(#mechGlow)">
    <polygon points="380,220 470,150 430,80 370,180" fill="url(#mechNeon)"/>
    <polygon points="410,250 490,200 455,130 400,230" fill="url(#laserPink)"/>
  </g>

  <!-- Cyber Hexagon / Ring -->
  <circle cx="250" cy="250" r="165" fill="none" stroke="url(#mechNeon)" stroke-width="16" filter="url(#mechGlow)"/>
  <circle cx="250" cy="250" r="154" fill="none" stroke="url(#laserPink)" stroke-width="3"/>
  <circle cx="250" cy="250" r="176" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

  <!-- Top Cyber Visor Crest -->
  <g transform="translate(250, 75)" filter="url(#mechGlow)">
    <polygon points="-40,-10 40,-10 30,15 -30,15" fill="url(#laserPink)" stroke="url(#mechNeon)" stroke-width="2"/>
    <line x1="-30" y1="2" x2="30" y2="2" stroke="#FFF" stroke-width="3"/>
  </g>

  <!-- Bottom Overlord Neon Plaque -->
  <g transform="translate(250, 420)" filter="url(#mechGlow)">
    <polygon points="-90,-16 90,-16 80,18 -80,18" fill="url(#mechNeon)" stroke="url(#laserPink)" stroke-width="3"/>
    <text x="0" y="8" font-family="'Arial Black', Impact, sans-serif" font-size="18" font-weight="900" fill="#FFF" text-anchor="middle" letter-spacing="2">OVERLORD</text>
  </g>
</svg>
