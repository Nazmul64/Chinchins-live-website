<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="speedCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="80%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
    <filter id="speedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- High-Tech Cyber Speedometer Ring -->
  <circle cx="250" cy="250" r="175" fill="none" stroke="url(#speedCyan)" stroke-width="15" filter="url(#speedGlow)"/>
  <circle cx="250" cy="250" r="162" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
  <circle cx="250" cy="250" r="188" fill="none" stroke="#0284C7" stroke-width="3"/>

  <!-- Speedometer Ticks -->
  <g stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="250" y1="65" x2="250" y2="78"/>
    <line x1="120" y1="120" x2="128" y2="128"/>
    <line x1="380" y1="120" x2="372" y2="128"/>
    <line x1="65" y1="250" x2="78" y2="250"/>
    <line x1="435" y1="250" x2="422" y2="250"/>
  </g>

  <!-- Top Cyber Headlamp Crest -->
  <g transform="translate(250, 70)" filter="url(#speedGlow)">
    <polygon points="-30,-8 30,-8 20,12 -20,12" fill="url(#speedCyan)" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="0" cy="2" r="5" fill="#FFF"/>
  </g>

  <!-- Bottom Speed Tachometer Gauge -->
  <g transform="translate(250, 420)" filter="url(#speedGlow)">
    <circle cx="0" cy="0" r="25" fill="#0F172A" stroke="url(#speedCyan)" stroke-width="3"/>
    <line x1="0" y1="0" x2="12" y2="-12" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#FFF"/>
  </g>
</svg>
