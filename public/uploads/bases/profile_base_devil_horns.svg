<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="devilRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="devilGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="devilGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Flaming Horn -->
  <g filter="url(#devilGlow)">
    <path d="M 170 120 C 130 90, 100 40, 120 15 C 145 20, 160 60, 195 105 Z" fill="url(#devilRuby)" stroke="url(#devilGold)" stroke-width="2.5"/>
  </g>

  <!-- Right Flaming Horn -->
  <g filter="url(#devilGlow)">
    <path d="M 330 120 C 370 90, 400 40, 380 15 C 355 20, 340 60, 305 105 Z" fill="url(#devilRuby)" stroke="url(#devilGold)" stroke-width="2.5"/>
  </g>

  <!-- Crimson Fire Ring -->
  <circle cx="250" cy="250" r="175" fill="none" stroke="url(#devilRuby)" stroke-width="15" filter="url(#devilGlow)"/>
  <circle cx="250" cy="250" r="165" fill="none" stroke="url(#devilGold)" stroke-width="3"/>
  <circle cx="250" cy="250" r="185" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>

  <!-- Top Center Golden Crest -->
  <g transform="translate(250, 75)" filter="url(#devilGlow)">
    <circle cx="0" cy="0" r="16" fill="url(#devilGold)" stroke="#FFF" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="url(#devilRuby)"/>
  </g>

  <!-- Bottom Flaming Wings Crest -->
  <g transform="translate(250, 420)" filter="url(#devilGlow)">
    <path d="M -80 -10 C -40 25, 40 25, 80 -10 C 50 35, -50 35, -80 -10 Z" fill="url(#devilGold)" stroke="url(#devilRuby)" stroke-width="2"/>
    <circle cx="0" cy="18" r="10" fill="url(#devilRuby)" stroke="#FFF" stroke-width="1.5"/>
  </g>
</svg>
