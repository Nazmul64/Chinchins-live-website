<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="devilGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="devilFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="35%" stop-color="#EF4444"/>
      <stop offset="75%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <filter id="devilGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes crownGleam6 { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    .royal-crown-6 { transform-origin: 250px 75px; animation: crownGleam6 2.8s infinite ease-in-out; }
  </style>

  <!-- Left Flaming Wings -->
  <g transform="translate(100, 250)" filter="url(#devilGlow)">
    <path d="M 0 -20 C -35 -40 -55 -20 -45 10 C -35 0 -15 0 0 -20 Z" fill="url(#devilGold)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 0 5 C -40 -15 -60 15 -50 38 C -40 28 -15 20 0 5 Z" fill="url(#devilFire)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 0 30 C -30 25 -45 50 -40 68 C -30 55 -10 40 0 30 Z" fill="url(#devilGold)"/>
  </g>

  <!-- Right Flaming Wings -->
  <g transform="translate(400, 250)" filter="url(#devilGlow)">
    <path d="M 0 -20 C 35 -40 55 -20 45 10 C 35 0 15 0 0 -20 Z" fill="url(#devilGold)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 0 5 C 40 -15 60 15 50 38 C 40 28 15 20 0 5 Z" fill="url(#devilFire)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 0 30 C 30 25 45 50 40 68 C 30 55 10 40 0 30 Z" fill="url(#devilGold)"/>
  </g>

  <!-- Circular Avatar Golden Rim (Hollow for Avatar) -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="url(#devilGold)" stroke-width="15" filter="url(#devilGlow)"/>
  <circle cx="250" cy="250" r="162" fill="none" stroke="url(#devilFire)" stroke-width="3"/>
  <circle cx="250" cy="250" r="182" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

  <!-- Top Flaming Devil Horns Royal Crown with Rubies -->
  <g class="royal-crown-6" filter="url(#devilGlow)">
    <!-- Devil Horns Arching Outwards -->
    <path d="M 180 80 C 150 40 130 10 110 5 C 130 30 155 70 185 95 Z" fill="url(#devilFire)" stroke="url(#devilGold)" stroke-width="2"/>
    <path d="M 320 80 C 350 40 370 10 390 5 C 370 30 345 70 315 95 Z" fill="url(#devilFire)" stroke="url(#devilGold)" stroke-width="2"/>
    
    <!-- Gold Crown Base -->
    <path d="M 180 105 L 165 45 L 205 70 L 250 15 L 295 70 L 335 45 L 320 105 Z" fill="url(#devilGold)" stroke="#FFFFFF" stroke-width="2"/>
    <ellipse cx="250" cy="105" rx="72" ry="17" fill="url(#devilFire)" stroke="url(#devilGold)" stroke-width="3"/>
    <!-- Rubies -->
    <circle cx="250" cy="18" r="8" fill="#FFFFFF" stroke="url(#devilFire)" stroke-width="2"/>
    <circle cx="165" cy="45" r="6" fill="url(#devilFire)" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="335" cy="45" r="6" fill="url(#devilFire)" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="205" cy="70" r="5" fill="#FFF"/>
    <circle cx="295" cy="70" r="5" fill="#FFF"/>
  </g>

  <!-- Bottom Flaming Rubies Plaque -->
  <g transform="translate(250, 420)" filter="url(#devilGlow)">
    <polygon points="0,-16 22,-5 14,18 -14,18 -22,-5" fill="url(#devilFire)" stroke="url(#devilGold)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>
  </g>
</svg>
