<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dollarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <linearGradient id="emeraldGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <filter id="dollarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Laurel Leaves Ring -->
  <circle cx="250" cy="250" r="175" fill="none" stroke="url(#dollarGold)" stroke-width="14" filter="url(#dollarGlow)"/>
  <circle cx="250" cy="250" r="165" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  <circle cx="250" cy="250" r="185" fill="none" stroke="url(#emeraldGreen)" stroke-width="3"/>

  <!-- Top Rich Gold Crown / Gems -->
  <g transform="translate(250, 75)" filter="url(#dollarGlow)">
    <polygon points="0,-25 25,10 -25,10" fill="url(#dollarGold)" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="0" cy="12" r="7" fill="url(#emeraldGreen)" stroke="#FFF" stroke-width="1"/>
  </g>

  <!-- Bottom Left: Floating 3D Dollar Coin -->
  <g transform="translate(100, 390)" filter="url(#dollarGlow)">
    <circle cx="0" cy="0" r="38" fill="url(#dollarGold)" stroke="#78350F" stroke-width="3"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#FFF" stroke-width="2" opacity="0.6"/>
    <text x="0" y="16" font-family="'Arial Black', Impact, sans-serif" font-size="44" font-weight="900" fill="#047857" stroke="#FFF" stroke-width="1" text-anchor="middle">$</text>
  </g>

  <!-- Bottom Right: Gold Coins Stack -->
  <g transform="translate(390, 390)" filter="url(#dollarGlow)">
    <ellipse cx="0" cy="10" rx="30" ry="12" fill="url(#dollarGold)" stroke="#78350F" stroke-width="2"/>
    <ellipse cx="0" cy="-5" rx="30" ry="12" fill="url(#dollarGold)" stroke="#78350F" stroke-width="2"/>
    <ellipse cx="0" cy="-20" rx="30" ry="12" fill="url(#dollarGold)" stroke="#78350F" stroke-width="2"/>
    <circle cx="0" cy="-20" r="18" fill="url(#emeraldGreen)" stroke="#FFF" stroke-width="1.5"/>
    <text x="0" y="-12" font-family="'Arial Black', Impact, sans-serif" font-size="20" font-weight="900" fill="#FFF" text-anchor="middle">$</text>
  </g>
</svg>
