<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cosmicPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="40%" stop-color="#C084FC"/>
      <stop offset="70%" stop-color="#7E22CE"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="cosmicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="cosmicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes galaxyRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .star-portal { transform-origin: 250px 250px; animation: galaxyRotate 20s infinite linear; }
  </style>

  <!-- Left Cosmic Wings -->
  <g filter="url(#cosmicGlow)">
    <path d="M 120 220 C 30 140, 10 60, 80 20 C 90 70, 50 130, 130 180 Z" fill="url(#cosmicPurple)"/>
    <path d="M 90 250 C 0 200, -10 120, 50 80 C 60 130, 30 180, 100 230 Z" fill="url(#cosmicGold)"/>
    <path d="M 100 300 C 10 300, 0 220, 70 170 C 70 220, 50 260, 110 280 Z" fill="url(#cosmicPurple)"/>
  </g>

  <!-- Right Cosmic Wings -->
  <g filter="url(#cosmicGlow)">
    <path d="M 380 220 C 470 140, 490 60, 420 20 C 410 70, 450 130, 370 180 Z" fill="url(#cosmicPurple)"/>
    <path d="M 410 250 C 500 200, 510 120, 450 80 C 440 130, 470 180, 400 230 Z" fill="url(#cosmicGold)"/>
    <path d="M 400 300 C 490 300, 500 220, 430 170 C 430 220, 450 260, 390 280 Z" fill="url(#cosmicPurple)"/>
  </g>

  <!-- Rotating Star Portal Ring -->
  <g class="star-portal">
    <circle cx="250" cy="70" r="6" fill="#FFF"/>
    <circle cx="430" cy="250" r="6" fill="#FDE047"/>
    <circle cx="250" cy="430" r="6" fill="#FFF"/>
    <circle cx="70" cy="250" r="6" fill="#FDE047"/>
  </g>

  <!-- Circular Avatar Ring -->
  <circle cx="250" cy="250" r="165" fill="none" stroke="url(#cosmicPurple)" stroke-width="16" filter="url(#cosmicGlow)"/>
  <circle cx="250" cy="250" r="154" fill="none" stroke="url(#cosmicGold)" stroke-width="3"/>
  <circle cx="250" cy="250" r="176" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

  <!-- Top Galactic Star Crown -->
  <g transform="translate(250, 75)" filter="url(#cosmicGlow)">
    <polygon points="0,-28 8,-8 28,-8 12,4 18,24 0,12 -18,24 -12,4 -28,-8 -8,-8" fill="url(#cosmicGold)" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" fill="url(#cosmicPurple)"/>
  </g>

  <!-- Bottom Sovereign Crest -->
  <g transform="translate(250, 420)" filter="url(#cosmicGlow)">
    <rect x="-80" y="-16" width="160" height="34" rx="8" fill="url(#cosmicPurple)" stroke="url(#cosmicGold)" stroke-width="3"/>
    <text x="0" y="8" font-family="'Arial Black', Impact, sans-serif" font-size="18" font-weight="900" fill="url(#cosmicGold)" text-anchor="middle" letter-spacing="2">GALAXY</text>
  </g>
</svg>
