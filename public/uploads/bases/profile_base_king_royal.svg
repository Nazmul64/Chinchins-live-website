<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kingGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="75%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <linearGradient id="rubyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes crownShine { 0%, 100% { opacity: 0.9; transform: scale(1); } 50% { opacity: 1; transform: scale(1.03); } }
    @keyframes wingFlap { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(1.5deg); } }
    .king-crown { transform-origin: 250px 70px; animation: crownShine 2.5s infinite ease-in-out; }
    .left-wing { transform-origin: 100px 250px; animation: wingFlap 3s infinite ease-in-out; }
    .right-wing { transform-origin: 400px 250px; animation: wingFlap 3s infinite ease-in-out reverse; }
  </style>

  <!-- Left Massive 24K Golden Wing -->
  <g class="left-wing" filter="url(#goldGlow)">
    <path d="M 120 220 C 40 160, 20 80, 80 40 C 90 90, 60 150, 130 200 Z" fill="url(#kingGold)"/>
    <path d="M 100 250 C 20 210, 10 140, 60 100 C 70 150, 50 200, 110 240 Z" fill="url(#kingGold)"/>
    <path d="M 110 300 C 30 300, 20 230, 80 180 C 80 230, 70 270, 120 290 Z" fill="url(#kingGold)"/>
    <path d="M 130 350 C 60 370, 40 320, 90 260 C 100 290, 90 330, 140 340 Z" fill="url(#kingGold)"/>
  </g>

  <!-- Right Massive 24K Golden Wing -->
  <g class="right-wing" filter="url(#goldGlow)">
    <path d="M 380 220 C 460 160, 480 80, 420 40 C 410 90, 440 150, 370 200 Z" fill="url(#kingGold)"/>
    <path d="M 400 250 C 480 210, 490 140, 440 100 C 430 150, 450 200, 390 240 Z" fill="url(#kingGold)"/>
    <path d="M 390 300 C 470 300, 480 230, 420 180 C 420 230, 430 270, 380 290 Z" fill="url(#kingGold)"/>
    <path d="M 370 350 C 440 370, 460 320, 410 260 C 400 290, 410 330, 360 340 Z" fill="url(#kingGold)"/>
  </g>

  <!-- Circular Avatar Golden Frame Border -->
  <circle cx="250" cy="250" r="165" fill="none" stroke="url(#kingGold)" stroke-width="16" filter="url(#goldGlow)"/>
  <circle cx="250" cy="250" r="154" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
  <circle cx="250" cy="250" r="176" fill="none" stroke="#78350F" stroke-width="3"/>

  <!-- Top Imperial King Crown with Rubies -->
  <g class="king-crown" filter="url(#goldGlow)">
    <path d="M 180 110 L 160 45 L 210 75 L 250 15 L 290 75 L 340 45 L 320 110 Z" fill="url(#kingGold)" stroke="#FFF" stroke-width="2"/>
    <ellipse cx="250" cy="110" rx="75" ry="18" fill="url(#rubyRed)" stroke="url(#kingGold)" stroke-width="4"/>
    <!-- Crown Jewels -->
    <circle cx="250" cy="18" r="9" fill="url(#rubyRed)" stroke="#FFF" stroke-width="2"/>
    <circle cx="160" cy="48" r="6" fill="#38BDF8" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="340" cy="48" r="6" fill="#38BDF8" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="210" cy="78" r="5" fill="#FFF"/>
    <circle cx="290" cy="78" r="5" fill="#FFF"/>
  </g>

  <!-- Bottom 3D "KING" Banner -->
  <g transform="translate(250, 420)" filter="url(#goldGlow)">
    <!-- Banner Ribbons -->
    <path d="M -130 0 L -150 -15 L -140 25 L -100 20 Z" fill="#991B1B"/>
    <path d="M 130 0 L 150 -15 L 140 25 L 100 20 Z" fill="#991B1B"/>
    <!-- Main Banner Plaque -->
    <path d="M -110 -18 L 110 -18 Q 120 15 100 25 L -100 25 Q -120 15 -110 -18 Z" fill="url(#rubyRed)" stroke="url(#kingGold)" stroke-width="4"/>
    <text x="0" y="11" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" fill="url(#kingGold)" stroke="#78350F" stroke-width="1.5" text-anchor="middle" letter-spacing="4">KING</text>
  </g>

  <!-- Sparkles -->
  <polygon points="120,70 125,85 140,90 125,95 120,110 115,95 100,90 115,85" fill="#FFF" opacity="0.8"/>
  <polygon points="380,70 385,85 400,90 385,95 380,110 375,95 360,90 375,85" fill="#FFF" opacity="0.8"/>
</svg>
