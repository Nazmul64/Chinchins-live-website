<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cadetSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="cadetCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="cadetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes crownGleam0 { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    .royal-crown-0 { transform-origin: 250px 75px; animation: crownGleam0 2.8s infinite ease-in-out; }
  </style>

  <!-- Left Silver Cadet Wings -->
  <g transform="translate(105, 250)" filter="url(#cadetGlow)">
    <path d="M 0 -15 C -25 -30 -40 -10 -30 15 C -20 5 -10 0 0 -15 Z" fill="url(#cadetSilver)" stroke="#475569" stroke-width="1.5"/>
    <path d="M 0 10 C -30 -5 -45 15 -35 35 C -25 25 -10 20 0 10 Z" fill="url(#cadetCyan)" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Right Silver Cadet Wings -->
  <g transform="translate(395, 250)" filter="url(#cadetGlow)">
    <path d="M 0 -15 C 25 -30 40 -10 30 15 C 20 5 10 0 0 -15 Z" fill="url(#cadetSilver)" stroke="#475569" stroke-width="1.5"/>
    <path d="M 0 10 C 30 -5 45 15 35 35 C 25 25 10 20 0 10 Z" fill="url(#cadetCyan)" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Circular Avatar Silver Rim -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="url(#cadetSilver)" stroke-width="12" filter="url(#cadetGlow)"/>
  <circle cx="250" cy="250" r="162" fill="none" stroke="url(#cadetCyan)" stroke-width="2.5"/>
  <circle cx="250" cy="250" r="182" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>

  <!-- Top Silver & Cyan Cadet Crown -->
  <g class="royal-crown-0" filter="url(#cadetGlow)">
    <path d="M 190 105 L 175 55 L 210 75 L 250 25 L 290 75 L 325 55 L 310 105 Z" fill="url(#cadetSilver)" stroke="#FFFFFF" stroke-width="2"/>
    <ellipse cx="250" cy="105" rx="65" ry="15" fill="url(#cadetCyan)" stroke="url(#cadetSilver)" stroke-width="2.5"/>
    <!-- Jewels -->
    <circle cx="250" cy="25" r="7" fill="#FFFFFF" stroke="url(#cadetCyan)" stroke-width="1.5"/>
    <circle cx="175" cy="55" r="5" fill="url(#cadetCyan)" stroke="#FFF" stroke-width="1"/>
    <circle cx="325" cy="55" r="5" fill="url(#cadetCyan)" stroke="#FFF" stroke-width="1"/>
  </g>

  <!-- Bottom Silver Star Badge -->
  <g transform="translate(250, 420)" filter="url(#cadetGlow)">
    <circle cx="0" cy="0" r="20" fill="url(#cadetSilver)" stroke="#FFFFFF" stroke-width="2"/>
    <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="url(#cadetCyan)"/>
  </g>
</svg>
