<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="80%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>
    <linearGradient id="tridentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <filter id="oceanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Aquatic Wings -->
  <g filter="url(#oceanGlow)">
    <path d="M 120 220 C 30 150, 10 70, 70 30 C 80 80, 50 140, 130 190 Z" fill="url(#oceanBlue)"/>
    <path d="M 95 245 C 10 200, 5 130, 55 90 C 65 140, 45 190, 105 235 Z" fill="url(#tridentGold)"/>
  </g>

  <!-- Right Aquatic Wings -->
  <g filter="url(#oceanGlow)">
    <path d="M 380 220 C 470 150, 490 70, 430 30 C 420 80, 450 140, 370 190 Z" fill="url(#oceanBlue)"/>
    <path d="M 405 245 C 490 200, 495 130, 445 90 C 435 140, 455 190, 395 235 Z" fill="url(#tridentGold)"/>
  </g>

  <!-- Azure Wave Ring -->
  <circle cx="250" cy="250" r="165" fill="none" stroke="url(#oceanBlue)" stroke-width="16" filter="url(#oceanGlow)"/>
  <circle cx="250" cy="250" r="154" fill="none" stroke="url(#tridentGold)" stroke-width="3"/>
  <circle cx="250" cy="250" r="176" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

  <!-- Top Golden Trident Crest -->
  <g transform="translate(250, 70)" filter="url(#oceanGlow)">
    <path d="M 0 -35 L 0 25 M -18 -15 L -18 10 Q -18 20 0 25 M 18 -15 L 18 10 Q 18 20 0 25" stroke="url(#tridentGold)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <polygon points="0,-38 -6,-24 6,-24" fill="url(#tridentGold)"/>
    <polygon points="-18,-18 -23,-8 -13,-8" fill="url(#tridentGold)"/>
    <polygon points="18,-18 13,-8 23,-8" fill="url(#tridentGold)"/>
  </g>

  <!-- Bottom Poseidon Ocean Plaque -->
  <g transform="translate(250, 420)" filter="url(#oceanGlow)">
    <rect x="-85" y="-16" width="170" height="34" rx="8" fill="url(#oceanBlue)" stroke="url(#tridentGold)" stroke-width="3"/>
    <text x="0" y="8" font-family="'Arial Black', Impact, sans-serif" font-size="18" font-weight="900" fill="url(#tridentGold)" text-anchor="middle" letter-spacing="2">POSEIDON</text>
  </g>
</svg>
