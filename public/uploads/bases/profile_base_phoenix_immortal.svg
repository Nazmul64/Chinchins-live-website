<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="phoenixFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="25%" stop-color="#F97316"/>
      <stop offset="65%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="phoenixGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <filter id="phoenixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Phoenix Fire Wings -->
  <g filter="url(#phoenixGlow)">
    <path d="M 120 220 C 30 150, 10 70, 70 30 C 80 80, 50 140, 130 190 Z" fill="url(#phoenixFlame)"/>
    <path d="M 95 245 C 10 200, 5 130, 55 90 C 65 140, 45 190, 105 235 Z" fill="url(#phoenixGold)"/>
    <path d="M 105 295 C 20 290, 15 220, 75 170 C 75 220, 65 260, 115 285 Z" fill="url(#phoenixFlame)"/>
  </g>

  <!-- Right Phoenix Fire Wings -->
  <g filter="url(#phoenixGlow)">
    <path d="M 380 220 C 470 150, 490 70, 430 30 C 420 80, 450 140, 370 190 Z" fill="url(#phoenixFlame)"/>
    <path d="M 405 245 C 490 200, 495 130, 445 90 C 435 140, 455 190, 395 235 Z" fill="url(#phoenixGold)"/>
    <path d="M 395 295 C 480 290, 485 220, 425 170 C 425 220, 435 260, 385 285 Z" fill="url(#phoenixFlame)"/>
  </g>

  <!-- Flaming Avatar Ring -->
  <circle cx="250" cy="250" r="165" fill="none" stroke="url(#phoenixFlame)" stroke-width="16" filter="url(#phoenixGlow)"/>
  <circle cx="250" cy="250" r="154" fill="none" stroke="url(#phoenixGold)" stroke-width="3"/>
  <circle cx="250" cy="250" r="176" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

  <!-- Top Phoenix Crown Crest -->
  <g transform="translate(250, 75)" filter="url(#phoenixGlow)">
    <path d="M 0 -30 L 15 -5 L 35 0 L 18 15 L 0 5 L -18 15 L -35 0 L -15 -5 Z" fill="url(#phoenixGold)" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="9" fill="url(#phoenixFlame)"/>
  </g>

  <!-- Bottom Immortal Fire Banner -->
  <g transform="translate(250, 420)" filter="url(#phoenixGlow)">
    <rect x="-85" y="-16" width="170" height="34" rx="8" fill="url(#phoenixFlame)" stroke="url(#phoenixGold)" stroke-width="3"/>
    <text x="0" y="8" font-family="'Arial Black', Impact, sans-serif" font-size="18" font-weight="900" fill="#FFF" text-anchor="middle" letter-spacing="2">PHOENIX</text>
  </g>
</svg>
