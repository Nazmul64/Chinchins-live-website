<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rank1Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>
    <filter id="rank1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Golden Rim -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="url(#rank1Gold)" stroke-width="14" filter="url(#rank1Glow)"/>
  <circle cx="250" cy="250" r="162" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>

  <!-- Left Golden Wings -->
  <g transform="translate(100, 250)" filter="url(#rank1Glow)">
    <path d="M 0 -15 C -35 -35 -55 -15 -45 15 C -35 5 -15 0 0 -15 Z" fill="url(#rank1Gold)" stroke="#713F12" stroke-width="1.5"/>
    <path d="M 0 10 C -40 -10 -60 15 -50 38 C -40 28 -15 20 0 10 Z" fill="url(#rank1Gold)" stroke="#713F12" stroke-width="1.5"/>
    <path d="M 0 32 C -35 28 -45 50 -40 68 C -30 55 -10 42 0 32 Z" fill="url(#rank1Gold)"/>
  </g>

  <!-- Right Golden Wings -->
  <g transform="translate(400, 250)" filter="url(#rank1Glow)">
    <path d="M 0 -15 C 35 -35 55 -15 45 15 C 35 5 15 0 0 -15 Z" fill="url(#rank1Gold)" stroke="#713F12" stroke-width="1.5"/>
    <path d="M 0 10 C 40 -10 60 15 50 38 C 40 28 15 20 0 10 Z" fill="url(#rank1Gold)" stroke="#713F12" stroke-width="1.5"/>
    <path d="M 0 32 C 35 28 45 50 40 68 C 30 55 10 42 0 32 Z" fill="url(#rank1Gold)"/>
  </g>

  <!-- Top Imperial Rank 1 Crown -->
  <g transform="translate(250, 70)" filter="url(#rank1Glow)">
    <path d="M -45 25 L -35 -15 L -10 10 L 0 -25 L 10 10 L 35 -15 L 45 25 Z" fill="url(#rank1Gold)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="0" cy="12" r="7" fill="#38BDF8" stroke="#FFF" stroke-width="1.5"/>
  </g>

  <!-- Bottom Rank 1 Plaque Badge -->
  <g transform="translate(250, 420)" filter="url(#rank1Glow)">
    <circle cx="0" cy="0" r="28" fill="url(#rank1Gold)" stroke="#FFFFFF" stroke-width="3"/>
    <text x="0" y="9" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="#713F12" text-anchor="middle">I</text>
    <!-- 3 Stars -->
    <polygon points="-25,20 -23,24 -19,24 -22,27 -21,31 -25,28 -29,31 -28,27 -31,24 -27,24" fill="url(#rank1Gold)"/>
    <polygon points="0,26 2,30 6,30 3,33 4,37 0,34 -4,37 -3,33 -6,30 -2,30" fill="url(#rank1Gold)"/>
    <polygon points="25,20 27,24 31,24 28,27 29,31 25,28 21,31 22,27 19,24 23,24" fill="url(#rank1Gold)"/>
  </g>
</svg>
