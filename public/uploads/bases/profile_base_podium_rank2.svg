<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rank2Silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="rank2Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="rank2Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Silver Rim -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="url(#rank2Silver)" stroke-width="14" filter="url(#rank2Glow)"/>
  <circle cx="250" cy="250" r="162" fill="none" stroke="url(#rank2Cyan)" stroke-width="2.5"/>
  <circle cx="250" cy="250" r="182" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

  <!-- Left Silver Wings -->
  <g transform="translate(100, 250)" filter="url(#rank2Glow)">
    <path d="M 0 -15 C -35 -35 -55 -15 -45 15 C -35 5 -15 0 0 -15 Z" fill="url(#rank2Silver)" stroke="#475569" stroke-width="1.5"/>
    <path d="M 0 10 C -40 -10 -60 15 -50 38 C -40 28 -15 20 0 10 Z" fill="url(#rank2Silver)" stroke="#475569" stroke-width="1.5"/>
    <path d="M 0 32 C -35 28 -45 50 -40 68 C -30 55 -10 42 0 32 Z" fill="url(#rank2Cyan)"/>
  </g>

  <!-- Right Silver Wings -->
  <g transform="translate(400, 250)" filter="url(#rank2Glow)">
    <path d="M 0 -15 C 35 -35 55 -15 45 15 C 35 5 15 0 0 -15 Z" fill="url(#rank2Silver)" stroke="#475569" stroke-width="1.5"/>
    <path d="M 0 10 C 40 -10 60 15 50 38 C 40 28 15 20 0 10 Z" fill="url(#rank2Silver)" stroke="#475569" stroke-width="1.5"/>
    <path d="M 0 32 C 35 28 45 50 40 68 C 30 55 10 42 0 32 Z" fill="url(#rank2Cyan)"/>
  </g>

  <!-- Top Silver Crown -->
  <g transform="translate(250, 70)" filter="url(#rank2Glow)">
    <path d="M -45 25 L -35 -15 L -10 10 L 0 -25 L 10 10 L 35 -15 L 45 25 Z" fill="url(#rank2Silver)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="0" cy="12" r="7" fill="url(#rank2Cyan)" stroke="#FFF" stroke-width="1.5"/>
  </g>

  <!-- Bottom Rank 2 Badge -->
  <g transform="translate(250, 420)" filter="url(#rank2Glow)">
    <circle cx="0" cy="0" r="28" fill="url(#rank2Silver)" stroke="#FFFFFF" stroke-width="3"/>
    <text x="0" y="9" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="#0F172A" text-anchor="middle">II</text>
    <!-- 2 Stars -->
    <polygon points="-15,22 -13,26 -9,26 -12,29 -11,33 -15,30 -19,33 -18,29 -21,26 -17,26" fill="url(#rank2Cyan)"/>
    <polygon points="15,22 17,26 21,26 18,29 19,33 15,30 11,33 12,29 9,26 13,26" fill="url(#rank2Cyan)"/>
  </g>
</svg>
