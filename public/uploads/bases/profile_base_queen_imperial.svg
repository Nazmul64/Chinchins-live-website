<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="queenGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="queenPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="queenPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
    <filter id="queenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes tiaraGlow { 0%, 100% { opacity: 0.9; transform: scale(1); } 50% { opacity: 1; transform: scale(1.03); } }
    @keyframes angelWings { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-1.5deg); } }
    .queen-crown { transform-origin: 250px 70px; animation: tiaraGlow 2.5s infinite ease-in-out; }
    .left-angel-wing { transform-origin: 100px 250px; animation: angelWings 3s infinite ease-in-out; }
    .right-angel-wing { transform-origin: 400px 250px; animation: angelWings 3s infinite ease-in-out reverse; }
  </style>

  <!-- Left Imperial Angel Wing -->
  <g class="left-angel-wing" filter="url(#queenGlow)">
    <path d="M 120 220 C 30 150, 10 70, 70 30 C 80 80, 50 140, 130 190 Z" fill="url(#queenGold)"/>
    <path d="M 95 245 C 10 200, 5 130, 55 90 C 65 140, 45 190, 105 235 Z" fill="url(#queenPink)"/>
    <path d="M 105 295 C 20 290, 15 220, 75 170 C 75 220, 65 260, 115 285 Z" fill="url(#queenGold)"/>
    <path d="M 125 345 C 50 360, 30 310, 80 250 C 90 280, 80 320, 135 335 Z" fill="url(#queenPurple)"/>
  </g>

  <!-- Right Imperial Angel Wing -->
  <g class="right-angel-wing" filter="url(#queenGlow)">
    <path d="M 380 220 C 470 150, 490 70, 430 30 C 420 80, 450 140, 370 190 Z" fill="url(#queenGold)"/>
    <path d="M 405 245 C 490 200, 495 130, 445 90 C 435 140, 455 190, 395 235 Z" fill="url(#queenPink)"/>
    <path d="M 395 295 C 480 290, 485 220, 425 170 C 425 220, 435 260, 385 285 Z" fill="url(#queenGold)"/>
    <path d="M 375 345 C 450 360, 470 310, 420 250 C 410 280, 420 320, 365 335 Z" fill="url(#queenPurple)"/>
  </g>

  <!-- Circular Avatar Golden & Pink Frame Ring -->
  <circle cx="250" cy="250" r="165" fill="none" stroke="url(#queenGold)" stroke-width="15" filter="url(#queenGlow)"/>
  <circle cx="250" cy="250" r="154" fill="none" stroke="url(#queenPink)" stroke-width="3"/>
  <circle cx="250" cy="250" r="176" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

  <!-- Top Imperial Queen Tiara / Crown with Diamonds & Pink Gems -->
  <g class="queen-crown" filter="url(#queenGlow)">
    <path d="M 175 110 L 160 50 L 205 75 L 250 20 L 295 75 L 340 50 L 325 110 Z" fill="url(#queenGold)" stroke="#FFF" stroke-width="2"/>
    <ellipse cx="250" cy="110" rx="75" ry="18" fill="url(#queenPink)" stroke="url(#queenGold)" stroke-width="3"/>
    <!-- Jewels -->
    <circle cx="250" cy="20" r="8" fill="#FFF" stroke="url(#queenPink)" stroke-width="2"/>
    <circle cx="160" cy="50" r="6" fill="#C084FC" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="340" cy="50" r="6" fill="#C084FC" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="205" cy="75" r="5" fill="#FFF"/>
    <circle cx="295" cy="75" r="5" fill="#FFF"/>
  </g>

  <!-- Bottom 3D "QUEEN" Banner -->
  <g transform="translate(250, 420)" filter="url(#queenGlow)">
    <!-- Banner Ribbons -->
    <path d="M -130 0 L -150 -15 L -140 25 L -100 20 Z" fill="#581C87"/>
    <path d="M 130 0 L 150 -15 L 140 25 L 100 20 Z" fill="#581C87"/>
    <!-- Main Banner Plaque -->
    <path d="M -110 -18 L 110 -18 Q 120 15 100 25 L -100 25 Q -120 15 -110 -18 Z" fill="url(#queenPurple)" stroke="url(#queenGold)" stroke-width="4"/>
    <text x="0" y="11" font-family="'Arial Black', Impact, sans-serif" font-size="26" font-weight="900" fill="url(#queenGold)" stroke="#3B0764" stroke-width="1.5" text-anchor="middle" letter-spacing="4">QUEEN</text>
  </g>

  <!-- Sparkles -->
  <polygon points="120,70 125,85 140,90 125,95 120,110 115,95 100,90 115,85" fill="#FFF" opacity="0.9"/>
  <polygon points="380,70 385,85 400,90 385,95 380,110 375,95 360,90 375,85" fill="#FFF" opacity="0.9"/>
</svg>
