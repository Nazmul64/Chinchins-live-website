<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGold9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="rosePink9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="40%" stop-color="#F43F5E"/>
      <stop offset="80%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>
    <filter id="roseGlow9" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes crownGleam9 { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    .royal-crown-9 { transform-origin: 250px 75px; animation: crownGleam9 2.8s infinite ease-in-out; }
  </style>

  <!-- Left Golden Pink Wings -->
  <g transform="translate(100, 250)" filter="url(#roseGlow9)">
    <path d="M 0 -20 C -35 -40 -55 -20 -45 10 C -35 0 -15 0 0 -20 Z" fill="url(#roseGold9)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 0 5 C -40 -15 -60 15 -50 38 C -40 28 -15 20 0 5 Z" fill="url(#rosePink9)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 0 30 C -30 25 -45 50 -40 68 C -30 55 -10 40 0 30 Z" fill="url(#roseGold9)"/>
  </g>

  <!-- Right Golden Pink Wings -->
  <g transform="translate(400, 250)" filter="url(#roseGlow9)">
    <path d="M 0 -20 C 35 -40 55 -20 45 10 C 35 0 15 0 0 -20 Z" fill="url(#roseGold9)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 0 5 C 40 -15 60 15 50 38 C 40 28 15 20 0 5 Z" fill="url(#rosePink9)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 0 30 C 30 25 45 50 40 68 C 30 55 10 40 0 30 Z" fill="url(#roseGold9)"/>
  </g>

  <!-- Circular Avatar Golden Rim (Hollow for Avatar) -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="url(#roseGold9)" stroke-width="15" filter="url(#roseGlow9)"/>
  <circle cx="250" cy="250" r="162" fill="none" stroke="url(#rosePink9)" stroke-width="3"/>
  <circle cx="250" cy="250" r="182" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

  <!-- Top Imperial Rose Tiara Crown with Diamonds -->
  <g class="royal-crown-9" filter="url(#roseGlow9)">
    <path d="M 180 105 L 165 45 L 205 70 L 250 15 L 295 70 L 335 45 L 320 105 Z" fill="url(#roseGold9)" stroke="#FFFFFF" stroke-width="2"/>
    <ellipse cx="250" cy="105" rx="72" ry="17" fill="url(#rosePink9)" stroke="url(#roseGold9)" stroke-width="3"/>
    <!-- Center Sparkling Diamond Heart -->
    <path d="M 250 15 C 240 0 230 15 250 30 C 270 15 260 0 250 15 Z" fill="#FFFFFF" stroke="url(#rosePink9)" stroke-width="1.5"/>
    <circle cx="165" cy="45" r="6" fill="url(#rosePink9)" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="335" cy="45" r="6" fill="url(#rosePink9)" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="205" cy="70" r="5" fill="#FFF"/>
    <circle cx="295" cy="70" r="5" fill="#FFF"/>
  </g>

  <!-- Bottom Crystal Heart Plaque with "Lv.9" Text -->
  <g transform="translate(250, 420)" filter="url(#roseGlow9)">
    <path d="M 0 5 C -25 -25 -45 5 0 35 C 45 5 25 -25 0 5 Z" fill="url(#rosePink9)" stroke="url(#roseGold9)" stroke-width="3.5"/>
    <text x="0" y="16" font-family="'Arial Black', Impact, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">Lv.9</text>
  </g>
</svg>
