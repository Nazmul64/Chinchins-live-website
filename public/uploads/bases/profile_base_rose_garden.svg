<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="35%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <linearGradient id="rosePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <filter id="roseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Golden Filigree Circle -->
  <circle cx="250" cy="250" r="175" fill="none" stroke="url(#roseGold)" stroke-width="15" filter="url(#roseGlow)"/>
  <circle cx="250" cy="250" r="165" fill="none" stroke="url(#rosePink)" stroke-width="3"/>
  <circle cx="250" cy="250" r="185" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

  <!-- Left Blooming Pink Roses -->
  <g transform="translate(100, 160)" filter="url(#roseGlow)">
    <circle cx="0" cy="0" r="28" fill="url(#rosePink)" stroke="url(#roseGold)" stroke-width="2"/>
    <path d="M -15 -5 C -10 -20, 10 -20, 15 -5 C 10 10, -10 10, -15 -5 Z" fill="#FFF" opacity="0.4"/>
    <circle cx="0" cy="0" r="10" fill="#FFE4E6"/>
  </g>
  <g transform="translate(85, 230)" filter="url(#roseGlow)">
    <circle cx="0" cy="0" r="22" fill="url(#rosePink)" stroke="url(#roseGold)" stroke-width="2"/>
  </g>

  <!-- Right Blooming Pink Roses -->
  <g transform="translate(400, 160)" filter="url(#roseGlow)">
    <circle cx="0" cy="0" r="28" fill="url(#rosePink)" stroke="url(#roseGold)" stroke-width="2"/>
    <path d="M -15 -5 C -10 -20, 10 -20, 15 -5 C 10 10, -10 10, -15 -5 Z" fill="#FFF" opacity="0.4"/>
    <circle cx="0" cy="0" r="10" fill="#FFE4E6"/>
  </g>

  <!-- Top Imperial Tiara with Pink Heart -->
  <g transform="translate(250, 75)" filter="url(#roseGlow)">
    <polygon points="0,-25 22,10 -22,10" fill="url(#roseGold)" stroke="#FFF" stroke-width="2"/>
    <circle cx="0" cy="12" r="7" fill="url(#rosePink)"/>
  </g>

  <!-- Bottom Golden Heart Locket -->
  <g transform="translate(250, 420)" filter="url(#roseGlow)">
    <path d="M 0 25 C -35 0, -40 -25, -15 -35 C 0 -35, 0 -20, 0 -20 C 0 -20, 0 -35, 15 -35 C 40 -25, 35 0, 0 25 Z" fill="url(#rosePink)" stroke="url(#roseGold)" stroke-width="3"/>
    <circle cx="0" cy="-10" r="6" fill="#FFF"/>
  </g>
</svg>
