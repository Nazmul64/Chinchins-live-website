<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bikeNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="bikeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="bikeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Speed Nitro Neon Ring -->
  <circle cx="250" cy="250" r="175" fill="none" stroke="url(#bikeNeon)" stroke-width="15" filter="url(#bikeGlow)"/>
  <circle cx="250" cy="250" r="165" fill="none" stroke="url(#bikeGold)" stroke-width="3"/>
  <circle cx="250" cy="250" r="185" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

  <!-- Top: Aerodynamic Racing Helmet -->
  <g transform="translate(250, 70)" filter="url(#bikeGlow)">
    <!-- Helmet Shell -->
    <path d="M -35 15 C -45 -20, 45 -20, 35 15 C 25 25, -25 25, -35 15 Z" fill="url(#bikeNeon)" stroke="url(#bikeGold)" stroke-width="2.5"/>
    <!-- Tinted Visor with Rainbow Reflect -->
    <path d="M -25 5 Q 0 -5 25 5 Q 15 15 -25 5 Z" fill="#F43F5E" opacity="0.9"/>
    <circle cx="0" cy="-8" r="4" fill="#FEF08A"/>
  </g>

  <!-- Bottom Left: Spinning Alloy Wheel -->
  <g transform="translate(100, 390)" filter="url(#bikeGlow)">
    <circle cx="0" cy="0" r="32" fill="#1E293B" stroke="url(#bikeGold)" stroke-width="3"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="url(#bikeGold)" stroke-width="2.5"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="url(#bikeGold)" stroke-width="2.5"/>
  </g>

  <!-- Bottom Right: Dual Exhaust Flame Burst -->
  <g transform="translate(390, 390)" filter="url(#bikeGlow)">
    <rect x="-15" y="-12" width="30" height="10" rx="3" fill="#64748B" transform="rotate(-20)"/>
    <rect x="-15" y="4" width="30" height="10" rx="3" fill="#64748B" transform="rotate(-20)"/>
    <polygon points="15,-18 35,-12 15,-6" fill="#F43F5E"/>
    <polygon points="15,-2 35,4 15,10" fill="#38BDF8"/>
  </g>
</svg>
