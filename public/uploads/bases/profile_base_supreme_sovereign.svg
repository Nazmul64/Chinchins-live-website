<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="godGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="80%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>
    <linearGradient id="diamondAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="godGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes sunburstSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .god-rays { transform-origin: 250px 250px; animation: sunburstSpin 25s infinite linear; }
  </style>

  <!-- Rotating 24K Sunburst Aura Rays -->
  <g class="god-rays" opacity="0.6" filter="url(#godGlow)">
    <polygon points="250,20 255,100 245,100" fill="url(#godGold)"/>
    <polygon points="250,480 255,400 245,400" fill="url(#godGold)"/>
    <polygon points="20,250 100,255 100,245" fill="url(#godGold)"/>
    <polygon points="480,250 400,255 400,245" fill="url(#godGold)"/>
    <polygon points="85,85 145,140 140,145" fill="url(#godGold)"/>
    <polygon points="415,415 355,360 360,355" fill="url(#godGold)"/>
    <polygon points="415,85 360,145 355,140" fill="url(#godGold)"/>
    <polygon points="85,415 140,355 145,360" fill="url(#godGold)"/>
  </g>

  <!-- Left Supreme Wings -->
  <g filter="url(#godGlow)">
    <path d="M 120 220 C 20 130, 0 50, 70 10 C 80 60, 40 120, 130 180 Z" fill="url(#godGold)"/>
    <path d="M 90 250 C -10 190, -20 110, 40 70 C 50 120, 20 170, 100 230 Z" fill="url(#diamondAura)"/>
    <path d="M 100 300 C 0 300, -10 210, 60 160 C 60 210, 40 250, 110 280 Z" fill="url(#godGold)"/>
  </g>

  <!-- Right Supreme Wings -->
  <g filter="url(#godGlow)">
    <path d="M 380 220 C 480 130, 500 50, 430 10 C 420 60, 460 120, 370 180 Z" fill="url(#godGold)"/>
    <path d="M 410 250 C 510 190, 520 110, 460 70 C 450 120, 480 170, 400 230 Z" fill="url(#diamondAura)"/>
    <path d="M 400 300 C 500 300, 510 210, 440 160 C 440 210, 460 250, 390 280 Z" fill="url(#godGold)"/>
  </g>

  <!-- Main Supreme 24K Gold Ring -->
  <circle cx="250" cy="250" r="165" fill="none" stroke="url(#godGold)" stroke-width="18" filter="url(#godGlow)"/>
  <circle cx="250" cy="250" r="152" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
  <circle cx="250" cy="250" r="178" fill="none" stroke="url(#diamondAura)" stroke-width="4"/>

  <!-- Top Supreme Halo & Imperial Diamond Crown -->
  <g transform="translate(250, 60)" filter="url(#godGlow)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#godGold)" stroke-width="6"/>
    <polygon points="0,-45 15,-15 45,-10 22,12 28,42 0,25 -28,42 -22,12 -45,-10 -15,-15" fill="url(#godGold)" stroke="#FFF" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="url(#diamondAura)" stroke="#FFF" stroke-width="2"/>
  </g>

  <!-- Bottom 3D "SUPREME" God-Tier Plaque -->
  <g transform="translate(250, 425)" filter="url(#godGlow)">
    <path d="M -110 -18 L 110 -18 Q 120 15 100 25 L -100 25 Q -120 15 -110 -18 Z" fill="url(#godGold)" stroke="#FFF" stroke-width="3"/>
    <text x="0" y="11" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="#713F12" text-anchor="middle" letter-spacing="4">SUPREME</text>
  </g>
</svg>
