<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="top3Purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
    <linearGradient id="top3Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="top3Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Purple Neon Ring -->
  <circle cx="250" cy="250" r="175" fill="none" stroke="url(#top3Purple)" stroke-width="15" filter="url(#top3Glow)"/>
  <circle cx="250" cy="250" r="165" fill="none" stroke="url(#top3Gold)" stroke-width="3"/>
  <circle cx="250" cy="250" r="185" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>

  <!-- Top Crown / Diamonds -->
  <g transform="translate(250, 75)" filter="url(#top3Glow)">
    <polygon points="0,-20 18,10 -18,10" fill="url(#top3Gold)" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="0" cy="12" r="6" fill="#F43F5E"/>
  </g>

  <!-- Bottom 3D "TOP3" Podium Banner -->
  <g transform="translate(250, 415)" filter="url(#top3Glow)">
    <rect x="-85" y="-18" width="170" height="38" rx="8" fill="url(#top3Purple)" stroke="url(#top3Gold)" stroke-width="3"/>
    <text x="0" y="10" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="url(#top3Gold)" stroke="#3B0764" stroke-width="1" text-anchor="middle" letter-spacing="3">TOP 3</text>
  </g>
</svg>
