<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="top3Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="top3Purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
    <filter id="top3Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes crownGleam4 { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    .royal-crown-4 { transform-origin: 250px 75px; animation: crownGleam4 2.8s infinite ease-in-out; }
  </style>

  <!-- Left Golden Wings -->
  <g transform="translate(100, 250)" filter="url(#top3Glow)">
    <path d="M 0 -20 C -35 -40 -55 -20 -45 10 C -35 0 -15 0 0 -20 Z" fill="url(#top3Gold)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 0 5 C -40 -15 -60 15 -50 38 C -40 28 -15 20 0 5 Z" fill="url(#top3Purple)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 0 30 C -30 25 -45 50 -40 68 C -30 55 -10 40 0 30 Z" fill="url(#top3Gold)"/>
  </g>

  <!-- Right Golden Wings -->
  <g transform="translate(400, 250)" filter="url(#top3Glow)">
    <path d="M 0 -20 C 35 -40 55 -20 45 10 C 35 0 15 0 0 -20 Z" fill="url(#top3Gold)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 0 5 C 40 -15 60 15 50 38 C 40 28 15 20 0 5 Z" fill="url(#top3Purple)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 0 30 C 30 25 45 50 40 68 C 30 55 10 40 0 30 Z" fill="url(#top3Gold)"/>
  </g>

  <!-- Circular Avatar Golden Rim (Hollow for Avatar) -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="url(#top3Gold)" stroke-width="15" filter="url(#top3Glow)"/>
  <circle cx="250" cy="250" r="162" fill="none" stroke="url(#top3Purple)" stroke-width="3"/>
  <circle cx="250" cy="250" r="182" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

  <!-- Top Purple Sapphire Tiara Crown with Diamonds -->
  <g class="royal-crown-4" filter="url(#top3Glow)">
    <path d="M 180 105 L 165 45 L 205 70 L 250 15 L 295 70 L 335 45 L 320 105 Z" fill="url(#top3Gold)" stroke="#FFFFFF" stroke-width="2"/>
    <ellipse cx="250" cy="105" rx="72" ry="17" fill="url(#top3Purple)" stroke="url(#top3Gold)" stroke-width="3"/>
    <!-- Center Crystal Diamond -->
    <polygon points="250,5 262,20 250,35 238,20" fill="#FFFFFF" stroke="url(#top3Purple)" stroke-width="1.5"/>
    <circle cx="165" cy="45" r="6" fill="url(#top3Purple)" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="335" cy="45" r="6" fill="url(#top3Purple)" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="205" cy="70" r="5" fill="#FFF"/>
    <circle cx="295" cy="70" r="5" fill="#FFF"/>
  </g>

  <!-- Bottom 3D "TOP 3" Plaque Badge -->
  <g transform="translate(250, 420)" filter="url(#top3Glow)">
    <path d="M -60 -15 L 60 -15 Q 70 12 50 22 L -50 22 Q -70 12 -60 -15 Z" fill="url(#top3Purple)" stroke="url(#top3Gold)" stroke-width="3.5"/>
    <text x="0" y="8" font-family="'Arial Black', Impact, sans-serif" font-size="18" font-weight="900" fill="url(#top3Gold)" stroke="#3B0764" stroke-width="1.2" text-anchor="middle" letter-spacing="2">TOP 3</text>
  </g>
</svg>
