<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="baronEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="baronSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="baronGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Halo Ring with Emerald Nodes -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="url(#baronSilver)" stroke-width="8" filter="url(#baronGlow)"/>
  <circle cx="250" cy="250" r="166" fill="none" stroke="url(#baronEmerald)" stroke-width="3"/>

  <!-- Top Crown Nodes -->
  <circle cx="250" cy="74" r="7" fill="url(#baronEmerald)" stroke="#FFF" stroke-width="2"/>
  <circle cx="230" cy="80" r="4" fill="url(#baronSilver)"/>
  <circle cx="270" cy="80" r="4" fill="url(#baronSilver)"/>

  <!-- Left Baron Wing Feathers -->
  <g transform="translate(85, 250)" filter="url(#baronGlow)">
    <path d="M 0 0 C -25 -20 -40 -10 -35 15 C -25 5 -10 5 0 0 Z" fill="url(#baronSilver)" stroke="url(#baronEmerald)" stroke-width="1.5"/>
    <path d="M 0 15 C -30 0 -45 15 -40 35 C -30 25 -15 20 0 15 Z" fill="url(#baronSilver)" stroke="url(#baronEmerald)" stroke-width="1.5"/>
    <path d="M 0 30 C -25 25 -35 40 -30 55 C -20 45 -10 38 0 30 Z" fill="url(#baronEmerald)"/>
  </g>

  <!-- Right Baron Wing Feathers -->
  <g transform="translate(415, 250)" filter="url(#baronGlow)">
    <path d="M 0 0 C 25 -20 40 -10 35 15 C 25 5 10 5 0 0 Z" fill="url(#baronSilver)" stroke="url(#baronEmerald)" stroke-width="1.5"/>
    <path d="M 0 15 C 30 0 45 15 40 35 C 30 25 15 20 0 15 Z" fill="url(#baronSilver)" stroke="url(#baronEmerald)" stroke-width="1.5"/>
    <path d="M 0 30 C 25 25 35 40 30 55 C 20 45 10 38 0 30 Z" fill="url(#baronEmerald)"/>
  </g>

  <!-- Bottom Baron Badge Emblem -->
  <g transform="translate(250, 420)" filter="url(#baronGlow)">
    <ellipse cx="0" cy="0" rx="35" ry="16" fill="url(#baronEmerald)" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="9" fill="url(#baronSilver)"/>
    <polygon points="0,-6 2,0 6,0 3,3 4,7 0,4 -4,7 -3,3 -6,0 -2,0" fill="url(#baronEmerald)"/>
  </g>
</svg>
