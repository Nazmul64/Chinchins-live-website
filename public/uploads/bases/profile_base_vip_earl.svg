<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="earlCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FECDD3"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="earlGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <filter id="earlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Halo Ring -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="url(#earlCrimson)" stroke-width="11" filter="url(#earlGlow)"/>
  <circle cx="250" cy="250" r="163" fill="none" stroke="url(#earlGold)" stroke-width="3"/>

  <!-- Top Crown Nodes -->
  <circle cx="250" cy="74" r="9" fill="url(#earlCrimson)" stroke="url(#earlGold)" stroke-width="2.5"/>
  <circle cx="222" cy="80" r="5" fill="url(#earlGold)"/>
  <circle cx="278" cy="80" r="5" fill="url(#earlGold)"/>

  <!-- Left Earl Wing Feathers -->
  <g transform="translate(85, 250)" filter="url(#earlGlow)">
    <path d="M 0 -15 C -35 -35 -50 -15 -45 15 C -35 5 -15 0 0 -15 Z" fill="url(#earlCrimson)" stroke="url(#earlGold)" stroke-width="1.5"/>
    <path d="M 0 10 C -40 -10 -55 15 -50 38 C -40 28 -15 20 0 10 Z" fill="url(#earlGold)" stroke="url(#earlCrimson)" stroke-width="1.5"/>
    <path d="M 0 32 C -35 28 -45 50 -40 68 C -30 55 -10 42 0 32 Z" fill="url(#earlCrimson)"/>
  </g>

  <!-- Right Earl Wing Feathers -->
  <g transform="translate(415, 250)" filter="url(#earlGlow)">
    <path d="M 0 -15 C 35 -35 50 -15 45 15 C 35 5 15 0 0 -15 Z" fill="url(#earlCrimson)" stroke="url(#earlGold)" stroke-width="1.5"/>
    <path d="M 0 10 C 40 -10 55 15 50 38 C 40 28 15 20 0 10 Z" fill="url(#earlGold)" stroke="url(#earlCrimson)" stroke-width="1.5"/>
    <path d="M 0 32 C 35 28 45 50 40 68 C 30 55 10 42 0 32 Z" fill="url(#earlCrimson)"/>
  </g>

  <!-- Bottom Earl Crossed Swords Badge -->
  <g transform="translate(250, 420)" filter="url(#earlGlow)">
    <!-- Red Gem Badge -->
    <polygon points="0,-18 20,-5 12,18 -12,18 -20,-5" fill="url(#earlCrimson)" stroke="url(#earlGold)" stroke-width="3"/>
    <!-- Crossed Golden Sabres -->
    <line x1="-15" y1="-12" x2="15" y2="12" stroke="url(#earlGold)" stroke-width="3"/>
    <line x1="15" y1="-12" x2="-15" y2="12" stroke="url(#earlGold)" stroke-width="3"/>
  </g>
</svg>
