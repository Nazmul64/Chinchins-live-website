<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="viscountPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
    <linearGradient id="viscountGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <filter id="viscountGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Halo Ring -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="url(#viscountPurple)" stroke-width="10" filter="url(#viscountGlow)"/>
  <circle cx="250" cy="250" r="164" fill="none" stroke="url(#viscountGold)" stroke-width="3"/>

  <!-- Top Crown Nodes -->
  <circle cx="250" cy="74" r="8" fill="url(#viscountGold)" stroke="#FFF" stroke-width="2"/>
  <circle cx="225" cy="80" r="5" fill="url(#viscountPurple)"/>
  <circle cx="275" cy="80" r="5" fill="url(#viscountPurple)"/>

  <!-- Left Viscount Wing Feathers -->
  <g transform="translate(85, 250)" filter="url(#viscountGlow)">
    <path d="M 0 -10 C -30 -30 -45 -15 -40 10 C -30 0 -15 0 0 -10 Z" fill="url(#viscountPurple)" stroke="url(#viscountGold)" stroke-width="1.5"/>
    <path d="M 0 10 C -35 -5 -50 15 -45 35 C -35 25 -15 20 0 10 Z" fill="url(#viscountPurple)" stroke="url(#viscountGold)" stroke-width="1.5"/>
    <path d="M 0 30 C -30 25 -40 45 -35 60 C -25 50 -10 40 0 30 Z" fill="url(#viscountGold)"/>
  </g>

  <!-- Right Viscount Wing Feathers -->
  <g transform="translate(415, 250)" filter="url(#viscountGlow)">
    <path d="M 0 -10 C 30 -30 45 -15 40 10 C 30 0 15 0 0 -10 Z" fill="url(#viscountPurple)" stroke="url(#viscountGold)" stroke-width="1.5"/>
    <path d="M 0 10 C 35 -5 50 15 45 35 C 35 25 15 20 0 10 Z" fill="url(#viscountPurple)" stroke="url(#viscountGold)" stroke-width="1.5"/>
    <path d="M 0 30 C 30 25 40 45 35 60 C 25 50 10 40 0 30 Z" fill="url(#viscountGold)"/>
  </g>

  <!-- Bottom Viscount Shield Plaque -->
  <g transform="translate(250, 420)" filter="url(#viscountGlow)">
    <!-- Shield -->
    <path d="M -22 -15 L 22 -15 L 22 5 Q 22 22 0 30 Q -22 22 -22 5 Z" fill="url(#viscountPurple)" stroke="url(#viscountGold)" stroke-width="3"/>
    <!-- Cross Swords -->
    <line x1="-12" y1="-8" x2="12" y2="16" stroke="url(#viscountGold)" stroke-width="2.5"/>
    <line x1="12" y1="-8" x2="-12" y2="16" stroke="url(#viscountGold)" stroke-width="2.5"/>
  </g>
</svg>
