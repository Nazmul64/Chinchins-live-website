<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="volleyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="volleyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="volleyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Frame Ring -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="url(#volleyYellow)" stroke-width="14" filter="url(#volleyGlow)"/>
  <circle cx="250" cy="250" r="162" fill="none" stroke="url(#volleyBlue)" stroke-width="3"/>
  <circle cx="250" cy="250" r="182" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>

  <!-- Top "VOLLEYBALL" Golden Banner -->
  <g transform="translate(250, 60)" filter="url(#volleyGlow)">
    <path d="M -130 25 Q 0 -15 130 25 L 115 62 Q 0 25 -115 62 Z" fill="url(#volleyYellow)" stroke="#78350F" stroke-width="2.5"/>
    <text x="0" y="42" font-family="'Arial Black', Impact, sans-serif" font-size="23" font-weight="900" fill="#78350F" text-anchor="middle" letter-spacing="3">VOLLEYBALL</text>
  </g>

  <!-- Bottom Left: Pro Tri-Color Volleyball -->
  <g transform="translate(110, 390)" filter="url(#volleyGlow)">
    <circle cx="0" cy="0" r="40" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
    <!-- Swirling Panels -->
    <path d="M -20 -35 Q 0 0 -20 35 L 0 40 Q 20 0 0 -40 Z" fill="url(#volleyBlue)"/>
    <path d="M 0 -40 Q 20 0 40 -10 L 35 15 Q 15 0 -15 -25 Z" fill="url(#volleyYellow)"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#0F172A" stroke-width="2.5"/>
  </g>

  <!-- Bottom Right: Volleyball Net & Gold Stars -->
  <g transform="translate(390, 390)" filter="url(#volleyGlow)">
    <rect x="-35" y="-35" width="70" height="40" fill="#0284C7" opacity="0.3" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="-35" y1="-15" x2="35" y2="-15" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="-15" y1="-35" x2="-15" y2="5" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="10" y1="-35" x2="10" y2="5" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Golden Star Badge -->
    <polygon points="0,5 6,22 24,22 10,32 15,48 0,38 -15,48 -10,32 -24,22 -6,22" fill="url(#volleyYellow)" stroke="#FFF" stroke-width="1.5"/>
  </g>
</svg>
