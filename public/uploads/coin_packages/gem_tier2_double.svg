<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" width="100%" height="100%">
  <defs>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe066" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gTop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="gSideL2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="gSideR2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="gCent2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="gBotL2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="gBotR2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="drop2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <circle cx="90" cy="80" r="75" fill="url(#glow2)"/>

  <!-- Left/Back Gem -->
  <g filter="url(#drop2)" transform="translate(48, 70) rotate(-14) scale(0.82) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop2)"/>
    <polygon points="36,72 52,48 80,72" fill="url(#gSideL2)"/>
    <polygon points="124,72 108,48 80,72" fill="url(#gSideR2)"/>
    <polygon points="36,72 80,72 80,126" fill="url(#gBotL2)"/>
    <polygon points="124,72 80,72 80,126" fill="url(#gBotR2)"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent2)"/>
    <line x1="36" y1="72" x2="124" y2="72" stroke="#fffbeb" stroke-width="1.2" opacity="0.9"/>
  </g>

  <!-- Right/Front Gem -->
  <g filter="url(#drop2)" transform="translate(122, 90) rotate(10) scale(0.92) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop2)"/>
    <polygon points="36,72 52,48 80,72" fill="url(#gSideL2)"/>
    <polygon points="124,72 108,48 80,72" fill="url(#gSideR2)"/>
    <polygon points="36,72 80,72 80,126" fill="url(#gBotL2)"/>
    <polygon points="124,72 80,72 80,126" fill="url(#gBotR2)"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent2)"/>
    <line x1="36" y1="72" x2="124" y2="72" stroke="#fffbeb" stroke-width="1.2" opacity="0.9"/>
  </g>

  <!-- Sparkles -->
  <g transform="translate(142, 45)">
    <path d="M0,-8 Q1,-1 8,0 Q1,1 0,8 Q-1,1 -8,0 Q-1,-1 0,-8 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(30, 60) scale(0.6)">
    <path d="M0,-8 Q1,-1 8,0 Q1,1 0,8 Q-1,1 -8,0 Q-1,-1 0,-8 Z" fill="#ffffff"/>
  </g>
</svg>
