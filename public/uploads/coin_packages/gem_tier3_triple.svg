<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" width="100%" height="100%">
  <defs>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe066" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gTop3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="gSideL3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="gSideR3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="gCent3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="gBotL3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="gBotR3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="85" r="85" fill="url(#glow3)"/>

  <!-- Base Shadows -->
  <ellipse cx="60" cy="148" rx="38" ry="8" fill="#d97706" opacity="0.3"/>
  <ellipse cx="140" cy="148" rx="38" ry="8" fill="#d97706" opacity="0.3"/>
  <ellipse cx="100" cy="116" rx="36" ry="7" fill="#ca8a04" opacity="0.25"/>

  <!-- Top Center Gem -->
  <g transform="translate(100, 56) scale(0.78) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop3)"/>
    <polygon points="36,72 52,48 80,72" fill="url(#gSideL3)"/>
    <polygon points="124,72 108,48 80,72" fill="url(#gSideR3)"/>
    <polygon points="36,72 80,72 80,126" fill="url(#gBotL3)"/>
    <polygon points="124,72 80,72 80,126" fill="url(#gBotR3)"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent3)"/>
    <line x1="36" y1="72" x2="124" y2="72" stroke="#fffbeb" stroke-width="1.2" opacity="0.9"/>
  </g>

  <!-- Bottom Left Gem -->
  <g transform="translate(60, 108) rotate(-12) scale(0.85) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop3)"/>
    <polygon points="36,72 52,48 80,72" fill="url(#gSideL3)"/>
    <polygon points="124,72 108,48 80,72" fill="url(#gSideR3)"/>
    <polygon points="36,72 80,72 80,126" fill="url(#gBotL3)"/>
    <polygon points="124,72 80,72 80,126" fill="url(#gBotR3)"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent3)"/>
    <line x1="36" y1="72" x2="124" y2="72" stroke="#fffbeb" stroke-width="1.2" opacity="0.9"/>
  </g>

  <!-- Bottom Right Gem -->
  <g transform="translate(140, 108) rotate(12) scale(0.85) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop3)"/>
    <polygon points="36,72 52,48 80,72" fill="url(#gSideL3)"/>
    <polygon points="124,72 108,48 80,72" fill="url(#gSideR3)"/>
    <polygon points="36,72 80,72 80,126" fill="url(#gBotL3)"/>
    <polygon points="124,72 80,72 80,126" fill="url(#gBotR3)"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent3)"/>
    <line x1="36" y1="72" x2="124" y2="72" stroke="#fffbeb" stroke-width="1.2" opacity="0.9"/>
  </g>

  <!-- Sparkles -->
  <g transform="translate(100, 20)">
    <path d="M0,-9 Q1,-1 9,0 Q1,1 0,9 Q-1,1 -9,0 Q-1,-1 0,-9 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(168, 80) scale(0.7)">
    <path d="M0,-8 Q1,-1 8,0 Q1,1 0,8 Q-1,1 -8,0 Q-1,-1 0,-8 Z" fill="#ffffff"/>
  </g>
</svg>
