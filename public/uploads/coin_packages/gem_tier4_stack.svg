<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="100%" height="100%">
  <defs>
    <radialGradient id="glow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe066" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gTop4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="gSideL4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="gSideR4" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="gCent4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="gBotL4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="gBotR4" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="drop4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <circle cx="110" cy="90" r="95" fill="url(#glow4)"/>

  <!-- Left Back Gem -->
  <g filter="url(#drop4)" transform="translate(62, 70) rotate(-16) scale(0.72) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop4)"/>
    <polygon points="36,72 52,48 80,72" fill="url(#gSideL4)"/>
    <polygon points="124,72 108,48 80,72" fill="url(#gSideR4)"/>
    <polygon points="36,72 80,72 80,126" fill="url(#gBotL4)"/>
    <polygon points="124,72 80,72 80,126" fill="url(#gBotR4)"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent4)"/>
  </g>

  <!-- Right Back Gem -->
  <g filter="url(#drop4)" transform="translate(158, 70) rotate(16) scale(0.72) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop4)"/>
    <polygon points="36,72 52,48 80,72" fill="url(#gSideL4)"/>
    <polygon points="124,72 108,48 80,72" fill="url(#gSideR4)"/>
    <polygon points="36,72 80,72 80,126" fill="url(#gBotL4)"/>
    <polygon points="124,72 80,72 80,126" fill="url(#gBotR4)"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent4)"/>
  </g>

  <!-- Center Top Gem -->
  <g filter="url(#drop4)" transform="translate(110, 50) scale(0.85) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop4)"/>
    <polygon points="36,72 52,48 80,72" fill="url(#gSideL4)"/>
    <polygon points="124,72 108,48 80,72" fill="url(#gSideR4)"/>
    <polygon points="36,72 80,72 80,126" fill="url(#gBotL4)"/>
    <polygon points="124,72 80,72 80,126" fill="url(#gBotR4)"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent4)"/>
    <line x1="36" y1="72" x2="124" y2="72" stroke="#fffbeb" stroke-width="1.2" opacity="0.9"/>
  </g>

  <!-- Front Base Gem -->
  <g filter="url(#drop4)" transform="translate(110, 115) scale(0.95) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop4)"/>
    <polygon points="36,72 52,48 80,72" fill="url(#gSideL4)"/>
    <polygon points="124,72 108,48 80,72" fill="url(#gSideR4)"/>
    <polygon points="36,72 80,72 80,126" fill="url(#gBotL4)"/>
    <polygon points="124,72 80,72 80,126" fill="url(#gBotR4)"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent4)"/>
    <line x1="36" y1="72" x2="124" y2="72" stroke="#fffbeb" stroke-width="1.2" opacity="0.9"/>
  </g>

  <!-- Sparkles -->
  <g transform="translate(110, 16)">
    <path d="M0,-10 Q1,-1 10,0 Q1,1 0,10 Q-1,1 -10,0 Q-1,-1 0,-10 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(180, 105) scale(0.7)">
    <path d="M0,-8 Q1,-1 8,0 Q1,1 0,8 Q-1,1 -8,0 Q-1,-1 0,-8 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(40, 105) scale(0.7)">
    <path d="M0,-8 Q1,-1 8,0 Q1,1 0,8 Q-1,1 -8,0 Q-1,-1 0,-8 Z" fill="#ffffff"/>
  </g>
</svg>
