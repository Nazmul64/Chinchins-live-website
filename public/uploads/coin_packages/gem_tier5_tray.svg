<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%">
  <defs>
    <radialGradient id="glow5" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffe066" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gTop5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="gCent5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="trayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="trayRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="100" r="100" fill="url(#glow5)"/>

  <!-- Base Shadow -->
  <ellipse cx="120" cy="174" rx="76" ry="12" fill="#2e1065" opacity="0.45"/>

  <!-- Purple Velvet Platform / Tray -->
  <g>
    <!-- Base Tray Shape -->
    <path d="M40,120 L200,120 L180,165 L60,165 Z" fill="url(#trayGradient)" stroke="#9333ea" stroke-width="1.5"/>
    <ellipse cx="120" cy="120" rx="80" ry="20" fill="#4c1d95" stroke="url(#trayRim)" stroke-width="3"/>
    <ellipse cx="120" cy="122" rx="72" ry="16" fill="#2e1065"/>
  </g>

  <!-- Heap of Gems Overflowing -->
  <!-- Left Gem -->
  <g transform="translate(75, 100) rotate(-22) scale(0.65) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop5)"/>
    <polygon points="36,72 80,72 80,126" fill="#ca8a04"/>
    <polygon points="124,72 80,72 80,126" fill="#d97706"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent5)"/>
  </g>

  <!-- Right Gem -->
  <g transform="translate(165, 100) rotate(22) scale(0.65) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop5)"/>
    <polygon points="36,72 80,72 80,126" fill="#ca8a04"/>
    <polygon points="124,72 80,72 80,126" fill="#d97706"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent5)"/>
  </g>

  <!-- Center Big Gem -->
  <g transform="translate(120, 75) scale(0.85) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop5)"/>
    <polygon points="36,72 80,72 80,126" fill="#ca8a04"/>
    <polygon points="124,72 80,72 80,126" fill="#d97706"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent5)"/>
    <line x1="36" y1="72" x2="124" y2="72" stroke="#fffbeb" stroke-width="1.2" opacity="0.9"/>
  </g>

  <!-- Front Small Gems -->
  <g transform="translate(100, 115) scale(0.55) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop5)"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent5)"/>
  </g>
  <g transform="translate(140, 115) scale(0.55) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop5)"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent5)"/>
  </g>

  <!-- Sparkles -->
  <g transform="translate(120, 25)">
    <path d="M0,-10 Q1,-1 10,0 Q1,1 0,10 Q-1,1 -10,0 Q-1,-1 0,-10 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(200, 95) scale(0.7)">
    <path d="M0,-8 Q1,-1 8,0 Q1,1 0,8 Q-1,1 -8,0 Q-1,-1 0,-8 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(45, 95) scale(0.7)">
    <path d="M0,-8 Q1,-1 8,0 Q1,1 0,8 Q-1,1 -8,0 Q-1,-1 0,-8 Z" fill="#ffffff"/>
  </g>
</svg>
