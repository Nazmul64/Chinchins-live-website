<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 210" width="100%" height="100%">
  <defs>
    <radialGradient id="glow6" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffe066" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#9333ea" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gTop6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="gCent6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="chestBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="chestGoldRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="drop6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#4c1d95" flood-opacity="0.7"/>
    </filter>
  </defs>

  <circle cx="130" cy="105" r="110" fill="url(#glow6)"/>

  <!-- Chest Body & Base -->
  <g filter="url(#drop6)">
    <!-- Bottom Chest Box -->
    <path d="M35,125 L225,125 L205,180 L55,180 Z" fill="url(#chestBody)" stroke="#581c87" stroke-width="2"/>
    <!-- Gold Trimming along Chest -->
    <path d="M35,125 L225,125 L220,135 L40,135 Z" fill="url(#chestGoldRim)"/>
    <path d="M55,175 L205,175 L203,180 L57,180 Z" fill="url(#chestGoldRim)"/>
    <rect x="75" y="130" width="12" height="48" fill="url(#chestGoldRim)"/>
    <rect x="173" y="130" width="12" height="48" fill="url(#chestGoldRim)"/>
    <!-- Lock plate -->
    <rect x="118" y="132" width="24" height="20" rx="4" fill="url(#chestGoldRim)" stroke="#854d0e" stroke-width="1"/>
    <circle cx="130" cy="140" r="3" fill="#3b0764"/>
    <polygon points="129,140 131,140 132,148 128,148" fill="#3b0764"/>
  </g>

  <!-- Mountain of Glowing Gems -->
  <!-- Top Center Gem -->
  <g transform="translate(130, 60) scale(0.95) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop6)"/>
    <polygon points="36,72 80,72 80,126" fill="#ca8a04"/>
    <polygon points="124,72 80,72 80,126" fill="#d97706"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent6)"/>
    <line x1="36" y1="72" x2="124" y2="72" stroke="#fffbeb" stroke-width="1.4" opacity="0.9"/>
  </g>

  <!-- Left Upper Gem -->
  <g transform="translate(85, 80) rotate(-18) scale(0.78) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop6)"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent6)"/>
  </g>

  <!-- Right Upper Gem -->
  <g transform="translate(175, 80) rotate(18) scale(0.78) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop6)"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent6)"/>
  </g>

  <!-- Left Lower Gems -->
  <g transform="translate(60, 110) rotate(-28) scale(0.7) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop6)"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent6)"/>
  </g>
  <!-- Right Lower Gems -->
  <g transform="translate(200, 110) rotate(28) scale(0.7) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop6)"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent6)"/>
  </g>

  <!-- Center Overflow Gems -->
  <g transform="translate(105, 115) scale(0.65) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop6)"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent6)"/>
  </g>
  <g transform="translate(155, 115) scale(0.65) translate(-80, -80)">
    <polygon points="52,48 108,48 124,72 36,72" fill="url(#gTop6)"/>
    <polygon points="56,72 104,72 80,126" fill="url(#gCent6)"/>
  </g>

  <!-- Giant Sparkles & Rays -->
  <g transform="translate(130, 14)">
    <path d="M0,-12 Q1,-1 12,0 Q1,1 0,12 Q-1,1 -12,0 Q-1,-1 0,-12 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(225, 60) scale(0.8)">
    <path d="M0,-9 Q1,-1 9,0 Q1,1 0,9 Q-1,1 -9,0 Q-1,-1 0,-9 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(35, 60) scale(0.8)">
    <path d="M0,-9 Q1,-1 9,0 Q1,1 0,9 Q-1,1 -9,0 Q-1,-1 0,-9 Z" fill="#ffffff"/>
  </g>
</svg>
