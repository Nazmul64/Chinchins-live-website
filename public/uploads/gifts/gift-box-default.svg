<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e63"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="95" fill="url(#glowGrad)"/>

  <g>
    <!-- Base Box Body -->
    <rect x="42" y="86" width="116" height="82" rx="14" fill="url(#boxFront)"/>
    <path d="M 42 100 Q 100 115 158 100 L 158 154 Q 100 172 42 154 Z" fill="url(#boxSide)" opacity="0.4"/>

    <!-- Vertical Golden Ribbon on Box -->
    <rect x="88" y="86" width="24" height="82" fill="url(#goldRibbon)"/>

    <!-- Box Lid -->
    <rect x="34" y="68" width="132" height="26" rx="8" fill="url(#lidGrad)"/>
    <!-- Lid Ribbon -->
    <rect x="88" y="68" width="24" height="26" fill="url(#goldRibbon)"/>

    <!-- Ribbon Bow Top -->
    <!-- Left Loop -->
    <path d="M 100 68 C 65 30 45 45 68 64 C 80 73 95 69 100 68 Z" fill="url(#goldRibbon)"/>
    <path d="M 98 66 C 75 38 60 50 76 63 Z" fill="#d97706" opacity="0.6"/>
    <!-- Right Loop -->
    <path d="M 100 68 C 135 30 155 45 132 64 C 120 73 105 69 100 68 Z" fill="url(#goldRibbon)"/>
    <path d="M 102 66 C 125 38 140 50 124 63 Z" fill="#d97706" opacity="0.6"/>
    <!-- Center Knot -->
    <circle cx="100" cy="68" r="9" fill="#fef08a"/>
    <circle cx="100" cy="68" r="7" fill="url(#goldRibbon)"/>

    <!-- Sparkles -->
    <path d="M 145 42 Q 152 42 152 35 Q 152 42 159 42 Q 152 42 152 49 Q 152 42 145 42 Z" fill="#fbbf24"/>
    <path d="M 48 56 Q 53 56 53 51 Q 53 56 58 56 Q 53 56 53 61 Q 53 56 48 56 Z" fill="#fef08a"/>
    <path d="M 160 120 Q 164 120 164 116 Q 164 120 168 120 Q 164 120 164 124 Q 164 120 160 120 Z" fill="#fef08a"/>
  </g>
</svg>
