<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_midnight_lovers" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="glow_midnight_lovers" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes floatAnim {
        0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
        50% { transform: translateY(-12px) rotate(2deg) scale(1.05); }
      }
      @keyframes pulseAura {
        0%, 100% { opacity: 0.3; transform: scale(0.95); }
        50% { opacity: 0.85; transform: scale(1.06); }
      }
      @keyframes spinRays {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .gift-core { animation: floatAnim 3s ease-in-out infinite; transform-origin: center; }
      .gift-aura { animation: pulseAura 2s ease-in-out infinite; transform-origin: center; }
      .gift-rays { animation: spinRays 12s linear infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Ambient Pulsing Glow Aura -->
  <circle cx="256" cy="256" r="215" fill="url(#grad_midnight_lovers)" opacity="0.35" filter="url(#glow_midnight_lovers)" class="gift-aura"/>
  
  <!-- Outer Rotating Halo Ring -->
  <circle cx="256" cy="256" r="225" fill="none" stroke="url(#grad_midnight_lovers)" stroke-width="6" stroke-dasharray="18 10" opacity="0.6" class="gift-rays"/>
  <circle cx="256" cy="256" r="195" fill="#0b0f19" stroke="url(#grad_midnight_lovers)" stroke-width="4" filter="url(#glow_midnight_lovers)"/>

  <!-- Core Floating Icon -->
  <g class="gift-core">
    <!-- Starbursts -->
    <path d="M256 68 L264 104 L300 112 L264 120 L256 156 L248 120 L212 112 L248 104 Z" fill="#ffffff" opacity="0.85"/>
    <path d="M110 330 L115 348 L133 353 L115 358 L110 376 L105 358 L87 353 L105 348 Z" fill="#ffd700" opacity="0.9"/>
    <path d="M390 330 L395 348 L413 353 L395 358 L390 376 L385 358 L367 353 L385 348 Z" fill="#00f0ff" opacity="0.9"/>

    <!-- Central Icon Character / Emoji Symbol -->
    <text x="256" y="275" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Outfit', sans-serif" font-size="120" text-anchor="middle" dominant-baseline="middle" filter="url(#glow_midnight_lovers)">🌕</text>
  </g>

  <!-- Title Ribbon at Bottom -->
  <rect x="86" y="405" width="340" height="48" rx="24" fill="#1e1b4b" stroke="url(#grad_midnight_lovers)" stroke-width="2.5" filter="url(#glow_midnight_lovers)"/>
  <text x="256" y="436" font-family="'Outfit', 'Inter', sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Midnight Lovers Moon</text>
</svg>