<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <defs>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="glassRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="neonBeam" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ground Neon Shadow -->
  <ellipse cx="180" cy="170" rx="140" ry="14" fill="url(#neonGlow)" opacity="0.6" filter="url(#neonBeam)"/>

  <!-- Speed Lightning Trails -->
  <path d="M 20 120 L 70 120 M 10 135 L 55 135 M 30 150 L 80 150" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Sports Car Body Profile -->
  <g filter="url(#neonBeam)">
    <!-- Aerodynamic Chassis -->
    <path d="M 70 145 
             L 50 135 
             C 45 130 55 115 80 110 
             L 130 95 
             C 150 70 200 68 235 90 
             L 290 105 
             C 320 112 335 125 330 140 
             L 320 148 
             Z" 
          fill="url(#carBody)" stroke="#60A5FA" stroke-width="2"/>

    <!-- Cabin Glass / Cockpit -->
    <path d="M 135 95 
             L 160 76 
             C 185 72 215 74 230 90 
             L 220 95 
             Z" 
          fill="url(#glassRoof)" stroke="#E0F2FE" stroke-width="1.5"/>

    <!-- Headlights & Tail Glow -->
    <path d="M 315 125 L 330 130 L 320 135 Z" fill="#00F0FF" filter="url(#neonBeam)"/>
    <path d="M 50 128 L 45 133 L 52 136 Z" fill="#EF4444" filter="url(#neonBeam)"/>

    <!-- Wheels -->
    <!-- Rear Wheel -->
    <circle cx="105" cy="148" r="24" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="105" cy="148" r="12" fill="#E2E8F0"/>
    <circle cx="105" cy="148" r="5" fill="#0284C7"/>

    <!-- Front Wheel -->
    <circle cx="265" cy="148" r="24" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="265" cy="148" r="12" fill="#E2E8F0"/>
    <circle cx="265" cy="148" r="5" fill="#0284C7"/>
  </g>

  <!-- Big Entrance Title Tag -->
  <text x="180" y="45" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#38BDF8" text-anchor="middle" letter-spacing="2">BUGATTI SUPER ENTRANCE</text>
</svg>
