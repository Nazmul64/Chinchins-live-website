<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93"/>
      <stop offset="50%" stop-color="#FF416C"/>
      <stop offset="100%" stop-color="#8A2387"/>
    </linearGradient>
    <linearGradient id="hiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
  </defs>

  <!-- Bubble Shape with Tail -->
  <g>
    <path d="M 40 30 
             L 280 30 
             A 24 24 0 0 1 304 54 
             L 304 116 
             A 24 24 0 0 1 280 140 
             L 90 140 
             L 50 165 
             L 58 140 
             L 40 140 
             A 24 24 0 0 1 16 116 
             L 16 54 
             A 24 24 0 0 1 40 30 Z" 
          fill="url(#pinkGradient)" stroke="#FFA0D0" stroke-width="2.5"/>
  </g>

  <!-- Golden "Hi" Icon Tag Badge (Matches screenshot icon) -->
  <g transform="translate(60, 52)">
    <rect x="0" y="0" width="60" height="40" rx="10" fill="#2A1B4E" stroke="#FFD700" stroke-width="2"/>
    <text x="30" y="28" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" fill="url(#hiGold)" text-anchor="middle">Hi</text>
  </g>

  <!-- Preview Text Lines -->
  <rect x="135" y="60" width="130" height="8" rx="4" fill="#FFFFFF" opacity="0.9"/>
  <rect x="135" y="78" width="85" height="8" rx="4" fill="#FFFFFF" opacity="0.6"/>

  <!-- Sparkle Heart -->
  <path d="M 270 45 C 270 38 260 38 260 45 C 260 52 270 58 270 58 C 270 58 280 52 280 45 C 280 38 270 38 270 45 Z" fill="#FFF" opacity="0.8"/>
</svg>
