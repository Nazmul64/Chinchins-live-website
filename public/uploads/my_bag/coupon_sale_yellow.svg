<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="ticketGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259"/>
      <stop offset="50%" stop-color="#FFA751"/>
      <stop offset="100%" stop-color="#FF7E40"/>
    </linearGradient>
    <linearGradient id="backTicket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Back Secondary Ticket Layer -->
  <g transform="translate(10, -8) rotate(-6 200 120)" opacity="0.85" filter="url(#shadow)">
    <rect x="50" y="45" width="300" height="150" rx="16" fill="url(#backTicket)"/>
    <circle cx="50" cy="120" r="16" fill="#181428"/>
    <circle cx="350" cy="120" r="16" fill="#181428"/>
  </g>

  <!-- Front Primary Ticket -->
  <g filter="url(#shadow)">
    <!-- Ticket Body with cutouts -->
    <path d="M 66 40 
             L 334 40 
             A 16 16 0 0 1 350 56 
             L 350 100 
             A 20 20 0 0 0 350 140 
             L 350 184 
             A 16 16 0 0 1 334 200 
             L 66 200 
             A 16 16 0 0 1 50 184 
             L 50 140 
             A 20 20 0 0 0 50 100 
             L 50 56 
             A 16 16 0 0 1 66 40 Z" 
          fill="url(#ticketGold)" stroke="#FFF3B0" stroke-width="2"/>

    <!-- Left side dotted perforation line -->
    <line x1="120" y1="50" x2="120" y2="190" stroke="#FFF" stroke-width="3" stroke-dasharray="6,6" opacity="0.65"/>

    <!-- Left Perforation Holes / Badge -->
    <circle cx="85" cy="85" r="5" fill="#FFF" opacity="0.75"/>
    <circle cx="85" cy="120" r="7" fill="#FF5E62" filter="url(#goldGlow)"/>
    <circle cx="85" cy="155" r="5" fill="#FFF" opacity="0.75"/>

    <!-- Main SALE Text -->
    <text x="235" y="132" font-family="'Outfit', 'Impact', sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4" filter="url(#shadow)">SALE</text>
    
    <!-- Subtitle / 50% OFF -->
    <text x="235" y="165" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#7C2D12" text-anchor="middle" letter-spacing="2">SUPER DISCOUNT COUPON</text>

    <!-- Sparkles -->
    <path d="M 315 65 Q 320 75 330 80 Q 320 85 315 95 Q 310 85 300 80 Q 310 75 315 65 Z" fill="#FFF" opacity="0.9"/>
    <circle cx="160" cy="70" r="3" fill="#FFF" opacity="0.8"/>
    <circle cx="300" cy="175" r="4" fill="#FFF" opacity="0.8"/>
  </g>
</svg>
