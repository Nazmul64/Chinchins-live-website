<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="bubbleBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>

  <!-- Banner Capsule Body Shadow -->
  <rect x="50" y="54" width="250" height="80" rx="40" fill="#000000" opacity="0.25"/>

  <!-- Banner Capsule Body -->
  <rect x="50" y="50" width="250" height="80" rx="40" fill="url(#bubbleBanner)" stroke="#F59E0B" stroke-width="2.5"/>

  <!-- Left Golden Coin Emblem (Matches screenshot icon) -->
  <g transform="translate(60, 90)">
    <circle cx="0" cy="0" r="32" fill="url(#goldCoin)" stroke="#FFF" stroke-width="2"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#78350F" stroke-width="1.5" stroke-dasharray="4,3"/>
    
    <!-- Mini Crown on Coin -->
    <path d="M -12 -5 L -16 8 L 16 8 L 12 -5 L 4 2 L 0 -12 L -4 2 Z" fill="#78350F"/>
    <circle cx="0" cy="3" r="3" fill="#FFF"/>
  </g>

  <!-- Entrance Text & Badge -->
  <text x="175" y="82" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#FFD700" letter-spacing="1">ROYAL ENTRANCE</text>
  <text x="175" y="105" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#E0E7FF">Entered Room with Glory ✨</text>

  <!-- Floating Sparkles -->
  <circle cx="275" cy="65" r="3" fill="#FFD700"/>
  <circle cx="120" cy="55" r="2.5" fill="#FFF"/>
</svg>
