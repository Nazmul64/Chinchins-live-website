<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="purpleRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Outer Aura Ring -->
  <circle cx="150" cy="150" r="120" fill="none" stroke="url(#purpleRing)" stroke-width="8" opacity="0.4"/>

  <!-- Rotating Celestial Ring -->
  <circle cx="150" cy="150" r="115" fill="none" stroke="url(#purpleRing)" stroke-width="6" stroke-dasharray="25 15"/>
  <circle cx="150" cy="150" r="105" fill="none" stroke="#FFF" stroke-width="2" opacity="0.6"/>

  <!-- Top Crown / Tiara Ornament -->
  <g transform="translate(150, 42)">
    <path d="M 0 -18 L 14 0 L 22 -10 L 16 12 L -16 12 L -22 -10 L -14 0 Z" fill="url(#goldAcc)"/>
    <circle cx="0" cy="-6" r="4" fill="#FFF"/>
  </g>

  <!-- Side Wing Ornaments -->
  <g transform="translate(32, 150)">
    <path d="M 0 0 C -12 -20 -20 0 0 25 C -10 10 -8 -10 0 0 Z" fill="url(#goldAcc)"/>
  </g>
  <g transform="translate(268, 150) scale(-1, 1)">
    <path d="M 0 0 C -12 -20 -20 0 0 25 C -10 10 -8 -10 0 0 Z" fill="url(#goldAcc)"/>
  </g>

  <!-- Bottom Crest Gem -->
  <g transform="translate(150, 255)">
    <polygon points="0,-10 12,0 0,14 -12,0" fill="url(#goldAcc)"/>
    <circle cx="0" cy="2" r="3" fill="#FFF"/>
  </g>

  <!-- Star Sparkles -->
  <circle cx="65" cy="85" r="3" fill="#FFF"/>
  <circle cx="235" cy="85" r="3" fill="#FFF"/>
</svg>
