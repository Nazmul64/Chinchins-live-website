<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A00E0"/>
      <stop offset="50%" stop-color="#8E2DE2"/>
      <stop offset="100%" stop-color="#F000FF"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Main Card Body -->
  <rect x="20" y="20" width="320" height="180" rx="20" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="2.5" filter="url(#cardShadow)"/>

  <!-- Holographic Wave Mesh -->
  <path d="M 20 120 Q 100 80 180 140 T 340 100 L 340 200 L 20 200 Z" fill="#FFFFFF" opacity="0.12"/>
  <path d="M 20 80 Q 120 150 220 70 T 340 140 L 340 200 L 20 200 Z" fill="#00FFFF" opacity="0.15"/>

  <!-- Avatar Placeholder Circle -->
  <circle cx="75" cy="80" r="32" fill="#2E0854" stroke="#FFF" stroke-width="2.5"/>
  <circle cx="75" cy="74" r="14" fill="#E0AAFF"/>
  <path d="M 55 102 C 55 90 95 90 95 102 Z" fill="#E0AAFF"/>

  <!-- Name & ID placeholders -->
  <rect x="125" y="60" width="120" height="12" rx="6" fill="#FFFFFF" opacity="0.95"/>
  <rect x="125" y="80" width="80" height="8" rx="4" fill="#00FFFF" opacity="0.85"/>

  <!-- VIP Badge -->
  <rect x="260" y="40" width="60" height="24" rx="12" fill="#F59E0B"/>
  <text x="290" y="56" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#FFF" text-anchor="middle">SVIP 10</text>

  <!-- Stars -->
  <circle cx="150" cy="140" r="2" fill="#FFF"/>
  <circle cx="280" cy="120" r="2.5" fill="#FFF"/>
  <circle cx="220" cy="160" r="1.5" fill="#FFF"/>
</svg>
